<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>48 Hours to Leerink V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap');
:root{
  --bg:#08090d;--card:#10131a;--card2:#161b26;--border:#1e2536;
  --text:#c9d1d9;--dim:#6b7b8d;--bright:#ecf0f5;
  --blue:#3b82f6;--blue-d:rgba(59,130,246,.15);
  --cyan:#22d3ee;--cyan-d:rgba(34,211,238,.1);
  --green:#34d399;--green-d:rgba(52,211,153,.12);
  --gold:#fbbf24;--gold-d:rgba(251,191,36,.12);
  --red:#f87171;--red-d:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-d:rgba(167,139,250,.1);
  --orange:#fb923c;--orange-d:rgba(251,146,60,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.amb{position:fixed;pointer-events:none;z-index:0}
.a1{top:-30%;right:-15%;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.06),transparent 70%)}
.a2{bottom:-20%;left:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.04),transparent 70%)}
#app{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:14px 18px 60px}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.logo{font-family:'Playfair Display',serif;font-size:1.05em;font-weight:800;color:var(--bright)}.logo span{color:var(--blue)}
.badge{font-size:.6em;background:var(--blue-d);color:var(--blue);padding:2px 8px;border-radius:8px;font-weight:600;letter-spacing:.5px;margin-left:8px}
.stats{display:flex;gap:16px}
.st{text-align:center}.st-v{font-size:1em;font-weight:800}.st-l{font-size:.55em;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.st-v.xp{color:var(--cyan)}.st-v.str{color:var(--gold)}.st-v.ch{color:var(--green)}

.pips{display:flex;gap:3px;margin:8px 0 14px}
.pip{height:4px;flex:1;border-radius:2px;background:var(--border);transition:.4s}
.pip.done{background:var(--green)}.pip.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}

.in{animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 22px;border-radius:10px;font-size:.85em;font-weight:700;animation:toastIn .4s ease,toastOut .4s ease 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.toast-g{background:var(--green-d);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.toast-r{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.toast-b{background:var(--gold-d);color:var(--gold);border:1px solid rgba(251,191,36,.3)}

.bx{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:12px}
.bx2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:12px 0;position:relative;overflow:hidden}
.bx2::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:3px}
.bx2.bl::before{background:var(--blue)}.bx2.gr::before{background:var(--green)}.bx2.go::before{background:var(--gold)}.bx2.cy::before{background:var(--cyan)}.bx2.pu::before{background:var(--purple)}.bx2.re::before{background:var(--red)}.bx2.or::before{background:var(--orange)}
.tag{font-size:.6em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:5px;display:block}
.tag-bl{color:var(--blue)}.tag-gr{color:var(--green)}.tag-go{color:var(--gold)}.tag-cy{color:var(--cyan)}.tag-pu{color:var(--purple)}.tag-re{color:var(--red)}.tag-or{color:var(--orange)}
h2{font-family:'Playfair Display',serif;font-size:1.7em;font-weight:800;color:var(--bright);line-height:1.2;margin-bottom:10px}
h4{font-size:.98em;color:var(--bright);margin-bottom:5px}
p,li{font-size:.88em;line-height:1.75;margin-bottom:8px}
ul{padding-left:16px}li{margin-bottom:4px}
.chap-tag{font-size:.68em;text-transform:uppercase;letter-spacing:2px;color:var(--blue);font-weight:700;margin-bottom:5px}
.hl{color:var(--cyan);font-weight:600}
.an{color:var(--cyan);border-left:2px solid var(--cyan);padding:6px 0 6px 14px;margin:10px 0;font-size:.88em;line-height:1.7;font-style:italic}
.funny{color:var(--gold);font-size:.82em;margin-top:4px;font-style:italic}

.dl{display:flex;gap:10px;margin:12px 0;animation:up .3s}
.dl-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex-shrink:0;border:2px solid var(--border)}
.dl-av.you{background:linear-gradient(135deg,#3f3a1e,#6c5a2d);border-color:var(--gold);color:var(--gold)}
.dl-av.md{background:linear-gradient(135deg,#1e3f1e,#2d6c2d);border-color:var(--green);color:var(--green)}
.dl-bb{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 14px;flex:1}
.dl-n{font-size:.7em;font-weight:700;margin-bottom:2px}
.dl-n.you{color:var(--gold)}.dl-n.md{color:var(--green)}
.dl-t{font-size:.86em;line-height:1.6}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:10px;font-family:inherit;font-weight:600;font-size:.86em;cursor:pointer;transition:.2s;border:none}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{box-shadow:0 0 20px rgba(59,130,246,.3);transform:translateY(-1px)}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-g:hover{border-color:var(--blue);color:var(--blue)}
.br{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.qz{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin:12px 0;animation:up .3s}
.qz-tag{font-size:.6em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px}
.qz-q{font-size:1.02em;font-weight:600;color:var(--bright);line-height:1.5;margin-bottom:14px}
.os{display:flex;flex-direction:column;gap:7px}
.o{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.2s;font-size:.86em;display:flex;align-items:center;gap:10px;font-family:inherit;color:var(--text);text-align:left;width:100%}
.o:hover:not(.lk){border-color:var(--blue);background:var(--blue-d)}
.o .lt{min-width:25px;height:25px;border-radius:7px;background:rgba(59,130,246,.1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;flex-shrink:0}
.o.ok{border-color:var(--green)!important;background:var(--green-d)!important;animation:pop .3s}.o.ok .lt{background:var(--green);color:#000}
.o.no{border-color:var(--red)!important;background:var(--red-d)!important;animation:shake .3s}.o.no .lt{background:var(--red);color:#fff}
.o.lk{cursor:default;opacity:.55}
.qz-e{margin-top:11px;padding:13px;background:var(--cyan-d);border:1px solid rgba(34,211,238,.15);border-radius:10px;font-size:.84em;line-height:1.7;animation:up .3s}
.qz-e strong{color:var(--cyan)}

.sc-wrap{margin:12px 0}
.sc-choice{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;transition:.2s;margin-bottom:7px;font-size:.88em;line-height:1.5;font-family:inherit;color:var(--text);text-align:left;width:100%;display:block}
.sc-choice:hover:not(.lk){border-color:var(--gold);background:var(--gold-d)}
.sc-choice.picked{border-color:var(--green);background:var(--green-d)}
.sc-choice.lk{cursor:default;opacity:.5}
.sc-result{padding:14px;border-radius:10px;margin-top:10px;font-size:.85em;line-height:1.7;animation:up .3s}
.sc-result.good{background:var(--green-d);border:1px solid rgba(52,211,153,.2);color:var(--green)}
.sc-result.meh{background:var(--gold-d);border:1px solid rgba(251,191,36,.2);color:var(--gold)}
.sc-result.bad{background:var(--red-d);border:1px solid rgba(248,113,113,.2);color:var(--red)}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.m-item{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.2s;font-size:.82em;text-align:center;font-family:inherit;color:var(--text);min-height:48px;display:flex;align-items:center;justify-content:center}
.m-item:hover:not(.lk):not(.matched){border-color:var(--blue);background:var(--blue-d)}
.m-item.sel{border-color:var(--gold);background:var(--gold-d);color:var(--gold)}
.m-item.matched{border-color:var(--green);background:var(--green-d);color:var(--green);cursor:default;opacity:.7}
.m-item.wrong{animation:shake .3s;border-color:var(--red)}
.m-item.lk{cursor:default}

.tf-wrap{display:flex;gap:8px;margin-top:10px}
.tf-btn{flex:1;padding:14px;border-radius:12px;font-family:inherit;font-weight:700;font-size:1em;cursor:pointer;border:2px solid var(--border);background:var(--card2);transition:.2s;color:var(--text)}
.tf-btn:hover:not(.lk){transform:translateY(-2px)}
.tf-btn.t:hover:not(.lk){border-color:var(--green);color:var(--green);background:var(--green-d)}
.tf-btn.f:hover:not(.lk){border-color:var(--red);color:var(--red);background:var(--red-d)}
.tf-btn.ok{border-color:var(--green)!important;background:var(--green-d)!important;color:var(--green)!important}
.tf-btn.no{border-color:var(--red)!important;background:var(--red-d)!important;color:var(--red)!important}
.tf-btn.lk{cursor:default;opacity:.5}

.ch-grid{display:grid;gap:8px;margin:14px 0}
.ch-i{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:12px}
.ch-i:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.07)}
.ch-i.lk{opacity:.35;cursor:default}.ch-i.lk:hover{border-color:var(--border);transform:none;box-shadow:none}
.ch-i.dn{border-color:rgba(52,211,153,.25)}
.ch-ic{font-size:1.5em;width:38px;text-align:center}
.ch-inf{flex:1}.ch-nm{font-weight:700;font-size:.9em;color:var(--bright)}.ch-ds{font-size:.75em;color:var(--dim);margin-top:1px}
.ch-st{font-size:.65em;font-weight:600;padding:3px 9px;border-radius:7px}
.ch-st.dn{background:var(--green-d);color:var(--green)}.ch-st.nw{background:var(--blue-d);color:var(--blue)}.ch-st.lk{background:rgba(107,123,141,.08);color:var(--dim)}

.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.rs-i{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.rs-v{font-size:1.2em;font-weight:800}.rs-l{font-size:.6em;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-top:2px}

.fcc{perspective:1000px;margin:14px 0;cursor:pointer}
.fcrd{width:100%;min-height:200px;position:relative;transition:transform .6s;transform-style:preserve-3d}
.fcrd.fl{transform:rotateX(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}
.fcfr{background:linear-gradient(135deg,#1a2744,#1e3a5c);border:1px solid rgba(59,130,246,.2)}
.fcbk{background:var(--card);border:1px solid var(--border);transform:rotateX(180deg);text-align:left;align-items:flex-start}
.fcfr h3{font-size:1.15em;color:var(--bright);font-family:'Playfair Display',serif}
.fch{font-size:.72em;color:var(--dim);margin-top:8px}
.fcbk p{font-size:.86em;line-height:1.7}

/* Conditioning mode */
.cond-bar{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.cond-btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;transition:.2s;font-family:inherit;font-size:.78em;color:var(--text);font-weight:600;flex:1;min-width:100px;text-align:center}
.cond-btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-d)}
.cond-btn.active{border-color:var(--purple);color:var(--purple);background:var(--purple-d)}
.timer-bar{height:6px;border-radius:3px;background:var(--border);margin:10px 0;overflow:hidden}
.timer-fill{height:100%;border-radius:3px;transition:width .1s linear}
.timer-fill.green{background:var(--green)}.timer-fill.yellow{background:var(--gold)}.timer-fill.red{background:var(--red)}
.recall-input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--bright);font-family:inherit;font-size:.92em;outline:none;transition:.2s}
.recall-input:focus{border-color:var(--blue)}
.leitner-boxes{display:flex;gap:6px;margin:10px 0}
.lbox{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;font-size:.7em}
.lbox-n{font-weight:800;font-size:1.3em;color:var(--bright)}
.lbox-l{color:var(--dim);margin-top:2px}

.hidden{display:none!important}.tc{text-align:center}
@media(max-width:600px){h2{font-size:1.35em}#app{padding:10px 12px 50px}.match-grid{grid-template-columns:1fr}.rs{grid-template-columns:1fr 1fr}.cond-bar{flex-direction:column}}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div>
<div id="app">
  <div class="top">
    <div style="display:flex;align-items:center"><div class="logo">Leerink <span>Partners</span></div><span class="badge">V2 + CONDITIONING</span></div>
    <div class="stats">
      <div class="st"><div class="st-v xp" id="xp">0</div><div class="st-l">XP</div></div>
      <div class="st"><div class="st-v str" id="str">0</div><div class="st-l">Streak</div></div>
      <div class="st"><div class="st-v ch" id="chdone">0/8</div><div class="st-l">Done</div></div>
    </div>
  </div>
  <div class="pips" id="pips"></div>
  <div id="m"></div>
</div>
<script>
// =========== STATE ===========
const LS_KEY='leerink_v2_prep';
const MISS_KEY='leerink_v2_miss';
const S={xp:0,str:0,mx:0,ok:0,tot:0,ch:-1,st:0,done:new Set(),condMisses:{}};
const $=id=>document.getElementById(id);
const M=()=>$('m');

function saveState(){
  const d={xp:S.xp,str:S.str,mx:S.mx,ok:S.ok,tot:S.tot,done:[...S.done]};
  try{localStorage.setItem(LS_KEY,JSON.stringify(d))}catch(e){}
}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY));
    if(d){S.xp=d.xp||0;S.str=d.str||0;S.mx=d.mx||0;S.ok=d.ok||0;S.tot=d.tot||0;d.done&&d.done.forEach(i=>S.done.add(i))}
  }catch(e){}
  try{
    const m=JSON.parse(localStorage.getItem(MISS_KEY));
    if(m)S.condMisses=m;
  }catch(e){}
}
function saveMisses(){try{localStorage.setItem(MISS_KEY,JSON.stringify(S.condMisses))}catch(e){}}
function recordMiss(itemId){S.condMisses[itemId]=(S.condMisses[itemId]||0)+1;saveMisses()}
function recordHit(itemId){if(S.condMisses[itemId]&&S.condMisses[itemId]>0)S.condMisses[itemId]--;saveMisses()}

loadState();

const upd=()=>{$('xp').textContent=S.xp;$('str').textContent=S.str;$('chdone').textContent=S.done.size+'/'+CH.length;
let p='';for(let i=0;i<CH.length;i++)p+=`<div class="pip ${S.done.has(i)?'done':S.ch===i?'on':''}"></div>`;$('pips').innerHTML=p;saveState()};

function toast(msg,type='g'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function ding(ok){S.tot++;if(ok){S.ok++;S.str++;if(S.str>S.mx)S.mx=S.str;const b=Math.min(S.str,5);S.xp+=10+b*2;
if(S.str===3)toast('3x Streak!','b');if(S.str===5)toast('5x Streak! On fire!','b');if(S.str===8)toast('8x STREAK! UNSTOPPABLE!','b');
}else S.str=0;upd()}

function D(w,t){
  const av={you:'YOU',md:'MD'};const nm={you:'You',md:'Healthcare Mentor'};
  return `<div class="dl"><div class="dl-av ${w}">${av[w]}</div><div class="dl-bb"><div class="dl-n ${w}">${nm[w]}</div><div class="dl-t">${t}</div></div></div>`;
}

// =========== MINI-GAME BUILDERS ===========
function mkQ(id,q,opts,ci,exp){
  const sh=opts.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  window['_sh_'+id]=sh;
  const L='ABCD';
  return `<div class="qz" id="${id}"><div class="qz-tag" style="color:var(--gold)">Knowledge Check</div>
  <div class="qz-q">${q}</div>
  <div class="os">${sh.map((o,i)=>`<button class="o" id="${id}${i}" onclick="doQ('${id}',${i},${ci})"><span class="lt">${L[i]}</span><span>${o.t}</span></button>`).join('')}</div>
  <div id="${id}e" class="hidden"></div></div>`;
}
window.doQ=function(id,pk,ci){
  const sh=window['_sh_'+id];const ok=sh[pk].i===ci;ding(ok);
  sh.forEach((o,i)=>{const b=$(id+i);b.classList.add('lk');b.onclick=null;if(o.i===ci)b.classList.add('ok');else if(i===pk)b.classList.add('no')});
  const exp=$(id).dataset.exp||'';
  $(id+'e').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Nailed it!</strong>':'<strong style="color:var(--red)">Not quite!</strong>'} ${exp}</div>`;
  $(id+'e').classList.remove('hidden');
};

function mkSc(id,prompt,choices){
  window['_sc_'+id]=choices;
  return `<div class="bx in" id="${id}"><div class="qz-tag" style="color:var(--orange)">What Would You Do?</div>
  <p style="font-size:.95em;font-weight:600;color:var(--bright);margin-bottom:12px">${prompt}</p>
  <div class="sc-wrap">${choices.map((c,i)=>`<button class="sc-choice" id="${id}c${i}" onclick="doSc('${id}',${i})">${c.text}</button>`).join('')}</div>
  <div id="${id}r" class="hidden"></div></div>`;
}
window.doSc=function(id,pk){
  const choices=window['_sc_'+id];if(!choices)return;
  const c=choices[pk];
  document.querySelectorAll(`[id^="${id}c"]`).forEach((b,i)=>{b.classList.add('lk');b.onclick=null;if(i===pk)b.classList.add('picked')});
  S.xp+=(c.xp||5);S.tot++;if(c.quality==='good')S.ok++;upd();
  $(id+'r').innerHTML=`<div class="sc-result ${c.quality}">${c.result}</div>`;
  $(id+'r').classList.remove('hidden');
  if(c.quality==='good')toast('+'+c.xp+' XP!');
};

function mkTF(id,statement,isTrue,exp){
  return `<div class="qz" id="${id}"><div class="qz-tag" style="color:var(--purple)">True or False?</div>
  <p style="font-size:1em;font-weight:600;color:var(--bright);line-height:1.5">${statement}</p>
  <div class="tf-wrap">
    <button class="tf-btn t" id="${id}t" onclick="doTF('${id}',true,${isTrue})">TRUE</button>
    <button class="tf-btn f" id="${id}f" onclick="doTF('${id}',false,${isTrue})">FALSE</button>
  </div>
  <div id="${id}e" class="hidden"></div></div>`;
}
window.doTF=function(id,picked,answer){
  const ok=picked===answer;ding(ok);
  $(id+'t').classList.add('lk');$(id+'f').classList.add('lk');
  $(id+'t').onclick=null;$(id+'f').onclick=null;
  if(answer)$(id+'t').classList.add('ok');else $(id+'f').classList.add('ok');
  if(!ok){if(picked)$(id+'t').classList.add('no');else $(id+'f').classList.add('no')}
  const exp=$(id).dataset.exp||'';
  $(id+'e').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Correct!</strong>':'<strong style="color:var(--red)">Nope!</strong>'} ${exp}</div>`;
  $(id+'e').classList.remove('hidden');
};

function mkMatch(id,pairs){
  const lefts=pairs.map((p,i)=>({t:p.left,id:i})).sort(()=>Math.random()-.5);
  const rights=pairs.map((p,i)=>({t:p.right,id:i})).sort(()=>Math.random()-.5);
  window['_m_'+id]={lefts,rights,sel:null,matched:0,total:pairs.length};
  return `<div class="bx in" id="${id}"><div class="qz-tag" style="color:var(--cyan)">Match Game -- tap a left item, then its match on the right</div>
  <div class="match-grid">
    <div>${lefts.map((l,i)=>`<div class="m-item" id="${id}L${i}" onclick="doMatch('${id}','L',${i},${l.id})" style="margin-bottom:6px">${l.t}</div>`).join('')}</div>
    <div>${rights.map((r,i)=>`<div class="m-item" id="${id}R${i}" onclick="doMatch('${id}','R',${i},${r.id})" style="margin-bottom:6px">${r.t}</div>`).join('')}</div>
  </div>
  <div id="${id}msg" style="text-align:center;margin-top:8px;font-size:.82em;color:var(--dim)">Tap a term on the left, then its match on the right</div></div>`;
}
window.doMatch=function(id,side,idx,pairId){
  const st=window['_m_'+id];if(!st)return;
  const el=$(id+side+idx);if(el.classList.contains('matched'))return;
  if(!st.sel){st.sel={side,idx,pairId,el};el.classList.add('sel');return}
  if(st.sel.side===side){st.sel.el.classList.remove('sel');if(st.sel.idx===idx){st.sel=null;return}
    st.sel={side,idx,pairId,el};el.classList.add('sel');return}
  const prev=st.sel;prev.el.classList.remove('sel');
  if(prev.pairId===pairId){prev.el.classList.add('matched');el.classList.add('matched');st.matched++;ding(true);
    if(st.matched===st.total){$(id+'msg').innerHTML='<span style="color:var(--green);font-weight:700">All matched! Nice work.</span>';toast('Perfect matching!')}
  }else{prev.el.classList.add('wrong');el.classList.add('wrong');ding(false);
    setTimeout(()=>{prev.el.classList.remove('wrong');el.classList.remove('wrong')},500)}
  st.sel=null;
};

{icon:'💊',name:'The Drug Development Pipeline',desc:'From preclinical to FDA approval',
steps:[
()=>`<div class="bx in">
  <div class="chap-tag">Chapter 3 of 8</div>
  <h2>The Drug Development Pipeline</h2>
  ${D('md',"Understanding how drugs get from the lab to the pharmacy shelf is essential. Every stage has different risk profiles and valuation implications.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">The Journey</span>
  <h4>FDA Approval Process</h4>
  <p>A new drug goes through these stages:</p>
  <ul>
    <li><strong>Preclinical</strong>: Lab and animal studies. Years of work before any human testing.</li>
    <li><strong>IND Filing</strong>: Company asks FDA for permission to test in humans.</li>
    <li><strong>Phase 1</strong>: Safety testing in 20-100 healthy volunteers. ~10% probability of eventual approval.</li>
    <li><strong>Phase 2</strong>: Efficacy + dose-finding in 100-300 patients. ~30% probability of eventual approval.</li>
    <li><strong>Phase 3</strong>: Large-scale efficacy trials in 1,000-5,000+ patients. ~60% probability of approval.</li>
    <li><strong>NDA/BLA Filing</strong>: New Drug Application (small molecules) or Biologics License Application (biologics).</li>
    <li><strong>FDA Review</strong>: 10-month standard review or 6-month priority review. PDUFA date is the action deadline.</li>
    <li><strong>Approval + Launch</strong>: Commercial rollout begins.</li>
  </ul>
  <div class="an">The entire process typically takes 10-15 years and costs $1-2 billion. Only about 1 in 10 drugs entering Phase 1 ultimately gets approved.</div>
</div>
${mkMatch('c2m0',[
  {left:'Phase 1',right:'Safety / ~10% PoS'},
  {left:'Phase 2',right:'Efficacy + dose / ~30% PoS'},
  {left:'Phase 3',right:'Large-scale / ~60% PoS'},
  {left:'NDA',right:'Small molecule filing'},
  {left:'BLA',right:'Biologic filing'},
  {left:'PDUFA',right:'FDA action date deadline'}
])}`,

()=>`<div class="bx in">
  ${D('md',"Now let's talk about what happens to stocks at each pipeline milestone -- this is where the money is made and lost.")}
</div>
<div class="bx2 gr">
  <span class="tag tag-gr">Valuation</span>
  <h4>Risk-Adjusted NPV (rNPV)</h4>
  <p>The standard method for valuing pipeline drugs:</p>
  <ul>
    <li>Estimate <strong>peak sales</strong> (e.g., "$3 billion at maturity")</li>
    <li>Build a revenue ramp (launch year through patent expiry)</li>
    <li>Apply <strong>probability of success (PoS)</strong> at each remaining stage</li>
    <li>Discount back to present value using WACC (typically 10-15% for biotech)</li>
    <li>Sum across all pipeline assets = <strong>Sum-of-the-Parts (SOTP)</strong></li>
  </ul>
  <div class="an">Example: A Phase 2 drug with $5B peak sales, 30% PoS, and 8 years to peak = rNPV might be ~$800M-$1.2B depending on discount rate and margin assumptions.</div>
</div>
<div class="bx2 re">
  <span class="tag tag-re">Critical Concept</span>
  <h4>Patent Cliff & Loss of Exclusivity (LOE)</h4>
  <p>When a drug's patent expires, <strong>generic/biosimilar</strong> competition enters. Revenue can drop <strong>70-90%</strong> within 1-2 years.</p>

{icon:'📊',name:'Biotech Valuation',desc:'SOTP, rNPV, cash burn, and when P/E fails',

()=>`<div class="bx in">

  ${D('md',"Valuing biotech companies is an art and a science. The approach changes dramatically depending on whether the company has revenue or not.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">Framework</span>
  <h4>When Different Valuation Methods Apply</h4>
  <ul>
    <li><strong>Pre-revenue biotech</strong>: P/E is meaningless (negative earnings). Use <span class="hl">Sum-of-the-Parts rNPV</span></li>
    <li><strong>Commercial-stage biotech</strong>: <span class="hl">EV/Revenue</span> (if early commercial) or <span class="hl">EV/EBITDA</span> (if profitable)</li>
    <li><strong>Large-cap pharma</strong>: <span class="hl">P/E, EV/EBITDA, DCF</span> -- traditional metrics work because cash flows are stable</li>
    <li><strong>MedTech</strong>: <span class="hl">EV/EBITDA, P/E</span> with premium for recurring revenue and organic growth</li>
    <li><strong>Managed Care</strong>: <span class="hl">P/E</span> is king -- very predictable earnings streams</li>
  </ul>
</div>
<div class="bx2 cy">
  <span class="tag tag-cy">SOTP Deep Dive</span>
  <h4>Sum-of-the-Parts for Pipeline Companies</h4>
  <p>SOTP breaks the company into individual components:</p>
  <ul>
    <li><strong>Each pipeline drug</strong> gets its own rNPV based on peak sales, PoS, timeline, and costs</li>
    <li><strong>Existing revenue</strong> (if any) valued via DCF or multiples</li>
    <li><strong>Cash on balance sheet</strong> added at face value</li>
    <li><strong>Debt</strong> subtracted</li>
    <li><strong>Corporate overhead/burn</strong> subtracted as a negative NPV</li>
    <li>Total SOTP / diluted shares = <strong>per-share value</strong></li>
  </ul>
</div>
<div class="bx2 re">
  <span class="tag tag-re">Cash is King</span>
  <h4>Cash Burn Rate & Runway</h4>
  <p>For pre-revenue biotechs, <strong>cash runway</strong> is existential:</p>
  <ul>
    <li><strong>Cash Runway</strong> = Cash / Quarterly Burn Rate. If a company has $500M and burns $50M/quarter, that's 10 quarters (~2.5 years)</li>
    <li>If runway is < 12-18 months, market fears <strong>dilutive equity offering</strong></li>
    <li>Watch for companies that need to raise capital <em>before</em> a key data readout -- this is bearish</li>
    <li>Strong cash position = <strong>negotiating leverage</strong> in partnerships and M&A</li>
  </ul>
</div>`,

  </ul>

  {text:'Short. GLP-1 adoption will structurally reduce demand for bariatric surgery. If patients can achieve 20%+ weight loss with a weekly injection, the value proposition of invasive surgery diminishes. The risk-reward is unfavorable for pure-play bariatric device companies.',result:'Strong answer. You demonstrated understanding of the GLP-1 thesis and its second-order effects. Bonus points if you noted that bariatric surgery won\\'t disappear entirely -- it\\'s still indicated for BMI >40 or severe comorbidities -- but the addressable market clearly shrinks.',quality:'good',xp:25},
  {text:'Long. GLP-1s will increase awareness of obesity as a disease, which will actually drive more patients to seek bariatric surgery.',result:'Creative thinking, but the data doesn\\'t support this. GLP-1s are already showing that patients prefer pharmaceutical solutions over surgery when available. Bariatric surgery volumes have already started to plateau in GLP-1 era.',quality:'bad',xp:5},
  {text:'Neutral. I\\'d need to see more data on GLP-1 adoption curves before taking a view.',result:'Understandable caution, but in an interview they want to see you take a view and defend it with logic. Having a well-reasoned directional opinion is better than fence-sitting.',quality:'meh',xp:8}
])}
${mkTF('c4tf0','The obesity drug market is projected to exceed $100 billion by 2030, making it one of the largest therapeutic categories in pharmaceutical history.',true,'')}
<div class="hidden" id="c4tf0" data-exp="<strong>True.</strong> Multiple Wall Street estimates project the GLP-1/obesity market to reach $100-150B+ by 2030. This would make it comparable to oncology in total market size. The speed of ramp is unprecedented in pharma history."></div>
${mkQ('c4q1','The SELECT cardiovascular outcomes trial showed that semaglutide reduced major adverse cardiovascular events (MACE) by approximately:',
  ['20%','5%','50%','75%'],0,'')}
<div class="hidden" id="c4q1" data-exp="The SELECT trial showed a <strong>20% reduction in MACE</strong> (heart attack, stroke, CV death) in obese/overweight patients without diabetes. This was a landmark result that massively expanded the addressable market for GLP-1s beyond weight loss into cardio-metabolic health."></div>`
]},

// ===== CHAPTER 5: Reading Clinical Trial Data =====
{icon:'🔬',name:'Reading Clinical Trial Data',desc:'p-values, endpoints, and interpreting readouts',
steps:[
()=>`<div class="bx in">
  <div class="chap-tag">Chapter 6 of 8</div>
  <h2>Reading Clinical Trial Data</h2>
  ${D('md',"When a biotech issues a press release on clinical data, the stock can move 50% in either direction within minutes. You need to know what to look for.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">Key Terms</span>
  <h4>Clinical Trial Statistics You Must Know</h4>
  <ul>
    <li><strong>Primary Endpoint</strong>: The main outcome the trial is designed to measure. This is what the FDA cares about most.</li>
    <li><strong>Secondary Endpoint</strong>: Additional outcomes measured. Important for label breadth and commercial potential.</li>
    <li><strong>p-value</strong>: Probability the result occurred by chance. <strong>p < 0.05</strong> is the standard threshold for statistical significance.</li>
    <li><strong>Confidence Interval (CI)</strong>: Range within which the true effect likely falls. Narrower = more precise. If CI crosses 1.0 (for hazard ratios) or 0 (for differences), result is NOT significant.</li>
    <li><strong>Intent-to-Treat (ITT)</strong>: Analysis includes ALL randomized patients, regardless of whether they completed the study. FDA preferred.</li>
    <li><strong>Per-Protocol (PP)</strong>: Only patients who completed the study per protocol. Usually shows better results than ITT.</li>
    <li><strong>Hazard Ratio (HR)</strong>: Ratio of event rates. HR < 1 means treatment is better. HR 0.80 = 20% risk reduction.</li>
  </ul>
</div>
<div class="bx2 gr">
  <span class="tag tag-gr">Reading a Press Release</span>
  <h4>What Makes a "Clean" vs "Messy" Readout</h4>
  <p><strong>Clean readout (bullish)</strong>:</p>
  <ul>
    <li>Hit primary endpoint with p < 0.001 (highly significant)</li>
    <li>Hit key secondary endpoints</li>
    <li>Consistent results across subgroups</li>
    <li>Manageable safety/tolerability profile</li>
    <li>ITT and PP analyses both positive</li>
  </ul>
  <p><strong>Messy readout (proceed with caution)</strong>:</p>
  <ul>
    <li>Primary endpoint barely significant (p = 0.04-0.05)</li>
    <li>Missed important secondary endpoints</li>
    <li>Results driven by one subgroup</li>
    <li>High discontinuation rate due to side effects</li>
    <li>Company emphasizes PP over ITT results</li>
  </ul>
</div>`,

()=>`${mkSc('c5sc0','A biotech reports p=0.048 on the primary endpoint but misses a key secondary endpoint on progression-free survival. The company\\'s press release emphasizes per-protocol results. Bull or bear?',[
  {text:'Bear-leaning. The p-value barely clears significance at 0.048, the key secondary miss raises questions about clinical meaningfulness, and emphasis on per-protocol over ITT is a red flag. I\\'d want to see the full data at a medical conference before getting constructive.',result:'Excellent analysis. You identified all three red flags: borderline significance, secondary endpoint miss, and the per-protocol emphasis. This shows sophisticated clinical data interpretation. In reality, the FDA may still approve, but the commercial potential is diminished without strong secondary data.',quality:'good',xp:25},
  {text:'Bull. They hit the primary endpoint, which is all that matters for FDA approval.',result:'While technically true that hitting primary is key for approval, the <strong>quality</strong> of the hit matters enormously. A p=0.048 with missed secondaries suggests the effect may be marginal. The stock likely trades down on this mixed data set.',quality:'meh',xp:8},
  {text:'Neutral. Need to wait for more information.',result:'While prudent, an interviewer wants to see analytical thinking. The data points given contain clear signals -- borderline primary, missed secondary, PP emphasis -- that warrant a bearish lean.',quality:'meh',xp:5}
])}
${mkTF('c5tf0','A confidence interval for a hazard ratio that crosses 1.0 indicates a statistically significant result.',false,'')}
<div class="hidden" id="c5tf0" data-exp="<strong>False.</strong> If the confidence interval for a hazard ratio <strong>crosses 1.0</strong>, it means the result is <strong>NOT statistically significant</strong>. A HR of 1.0 means no difference between treatment and control. The CI must be entirely below 1.0 to show the drug is significantly better."></div>
${mkQ('c5q0','In clinical trials, what is the difference between Intent-to-Treat (ITT) and Per-Protocol (PP) analysis?',
  ['ITT includes all randomized patients; PP only includes those who completed the study as designed','ITT only includes patients who responded; PP includes everyone','They are the same thing with different names','ITT is used in Phase 1; PP is used in Phase 3'],0,'')}
<div class="hidden" id="c5q0" data-exp="<strong>ITT includes ALL randomized patients</strong> regardless of whether they dropped out, switched treatments, or were non-compliant. <strong>PP only includes compliant completers</strong>. ITT is more conservative and FDA-preferred because it reflects real-world use. If a company only shows PP results, be skeptical."></div>
${mkTF('c5tf1','A p-value of 0.001 provides stronger statistical evidence than a p-value of 0.04, though both are considered statistically significant at the 0.05 threshold.',true,'')}
<div class="hidden" id="c5tf1" data-exp="<strong>True.</strong> Both p < 0.05 are technically significant, but p=0.001 means there's only a 0.1% chance the result is due to random chance, vs. 4% for p=0.04. Lower p-values give much more confidence in the result. In healthcare investing, a p=0.001 hit on primary moves stocks much more than a p=0.04 hit."></div>`
]},

// ===== CHAPTER 6: Healthcare Policy & Regulation =====
{icon:'⚖️',name:'Healthcare Policy & Regulation',desc:'IRA, Medicare negotiation, biosimilars, 340B',
steps:[
()=>`<div class="bx in">
  <div class="chap-tag">Chapter 7 of 8</div>
  <h2>Healthcare Policy & Regulation</h2>
  ${D('md',"Policy risk is one of the biggest overhangs on healthcare stocks. You need to understand the IRA, Medicare negotiation, and how these reshape the industry.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">IRA Impact</span>
  <h4>Inflation Reduction Act (IRA) -- Drug Pricing Provisions</h4>
  <p>The IRA, signed in August 2022, introduced the most significant drug pricing reform in decades:</p>
  <ul>
    <li><strong>Medicare Drug Price Negotiation</strong>: CMS can now negotiate prices on select high-spend Medicare drugs. First 10 drugs selected in 2023, prices effective 2026</li>
    <li><strong>Small molecule penalty</strong>: Small molecules eligible for negotiation after <strong>9 years</strong> on market, biologics after <strong>13 years</strong>. This creates an incentive to develop biologics over small molecules</li>
    <li><strong>Inflation rebates</strong>: If drug prices rise faster than inflation, manufacturers must pay rebates to Medicare</li>
    <li><strong>$2,000 Part D out-of-pocket cap</strong>: Reduces patient costs but shifts financial burden to insurers and manufacturers</li>
  </ul>
  <div class="an">The first 10 drugs selected for negotiation include Eliquis, Jardiance, Xarelto, Januvia, Farxiga, Entresto, Enbrel, Imbruvica, Stelara, and select insulins. These represent ~$50B in Medicare spending.</div>
</div>
<div class="bx2 go">
  <span class="tag tag-go">340B Program</span>
  <h4>340B Drug Pricing Program</h4>
  <p>The 340B program requires drug manufacturers to provide <strong>outpatient drugs at significantly reduced prices</strong> to eligible healthcare organizations (safety-net hospitals, FQHCs, etc.).</p>
  <ul>
    <li>Hospitals buy drugs at 340B discount (25-50% off) but can bill insurers at higher rates</li>
    <li>The <strong>spread</strong> is a major revenue source for safety-net hospitals</li>
    <li>Program has grown massively -- now covers ~$44B in drug purchases annually</li>
    <li>Pharma companies have been restricting 340B discounts for contract pharmacies, leading to litigation</li>
  </ul>
</div>`,

()=>`<div class="bx2 cy">
  <span class="tag tag-cy">Biosimilars</span>
  <h4>Biosimilar Competition Dynamics</h4>
  <p>Biosimilars are the biologic equivalent of generics, but with key differences:</p>
  <ul>
    <li><strong>Biologics are complex proteins</strong> -- biosimilars are "highly similar" but not identical copies</li>
    <li>Biosimilar price discounts are typically <strong>15-35%</strong> (vs. 80-90% for small molecule generics)</li>
    <li>Adoption is slower due to physician comfort, interchangeability requirements, and rebate dynamics</li>
    <li><strong>Humira biosimilars</strong>: 8+ launched in 2023, but AbbVie retained significant share through rebate contracts</li>
    <li>Key players: Sandoz (spun from Novartis), Amgen, Teva, Samsung Bioepis</li>
  </ul>
  <div class="an">Biosimilar competition is less disruptive than generic entry but still material. Expect 30-50% revenue erosion over 3-5 years post-LOE for biologics, vs. 80%+ in year 1 for small molecules going generic.</div>
</div>
${mkQ('c6q0','Under the IRA, small molecule drugs are eligible for Medicare price negotiation after how many years on market?',
  ['9 years','13 years','5 years','20 years'],0,'')}
<div class="hidden" id="c6q0" data-exp="Small molecules face negotiation after <strong>9 years</strong>, while biologics get <strong>13 years</strong>. This 4-year gap has created a perverse incentive: pharma companies may shift R&D toward biologics to get more years of unregulated pricing. Some analysts call this the 'small molecule penalty.'"></div>
${mkTF('c6tf0','Biosimilar drugs typically achieve the same 80-90% price discounts that generic small molecule drugs achieve.',false,'')}
<div class="hidden" id="c6tf0" data-exp="<strong>False.</strong> Biosimilar discounts are typically <strong>15-35%</strong>, much less than the 80-90% discounts for generic small molecules. This is because biologics are complex proteins that are expensive to manufacture, and adoption is slower due to physician switching inertia and rebate dynamics."></div>
${mkQ('c6q1','Which of the following is NOT a provision of the Inflation Reduction Act\\'s drug pricing reforms?',
  ['Government sets all drug prices at launch for new medications','Medicare can negotiate prices on select high-spend drugs','Drug price increases above inflation trigger manufacturer rebates','$2,000 annual out-of-pocket cap for Medicare Part D beneficiaries'],0,'')}
<div class="hidden" id="c6q1" data-exp="The IRA does NOT give the government power to set prices on <strong>all new drugs at launch</strong>. It only allows Medicare to negotiate on <strong>select existing high-spend drugs</strong> that have been on the market for 9+ years (small molecules) or 13+ years (biologics). This distinction is critical."></div>`
]},

${mkSc('c7sc0','"Walk me through a healthcare stock you follow and give me your investment thesis."',[

()=>`${mkSc('c7sc1','"What\\'s your view on the GLP-1 market? Who wins?"',[
  {text:'Both Novo and Lilly win in a $100B+ market, but Lilly has the edge long-term. Tirzepatide\\'s dual mechanism (GIP/GLP-1) delivers superior weight loss (~22.5% vs ~15-17% for semaglutide). Lilly\\'s oral formulation and combination approaches could further differentiate. The real question isn\\'t who wins between NVO/LLY -- it\\'s whether new entrants like Amgen\\'s MariTide can disrupt the duopoly.',result:'Excellent. You showed the market is big enough for multiple winners, gave a nuanced view with specific data, and raised the important competitive question about new entrants. This demonstrates deep sector knowledge.',quality:'good',xp:30},
  {text:'Novo Nordisk wins because they were first to market and have the strongest brand.',result:'First-mover matters but isn\\'t decisive in pharma. Lilly\\'s tirzepatide shows better clinical data. Address the science, not just the brand. The interviewer wants to see you engage with the clinical differentiation.',quality:'meh',xp:10},
  {text:'I think GLP-1s are overhyped and the market is too crowded.',result:'Contrarian views can work but need strong evidence. The clinical data (cardiovascular outcomes, weight loss durability) and payer willingness to cover are strong. Saying "overhyped" without addressing the $100B+ TAM estimate specifics won\\'t fly.',quality:'bad',xp:3}
])}
${mkSc('c7sc2','"How would you think about the impact of IRA on large-cap pharma?"',[
  {text:'The IRA creates a structural headwind but is manageable for diversified large-caps. The immediate impact is limited -- only 10 drugs initially, with negotiated prices effective 2026. The bigger concern is the small molecule penalty (9 vs 13 year timeline) which may shift R&D toward biologics. For specific companies: Merck (Keytruda exposure), Bristol-Myers, and AbbVie face the most near-term risk. The inflation rebate provisions also limit annual price increases, compressing revenue growth by 1-2% annually.',result:'Superb answer. You addressed: the near-term vs. long-term impact, the structural R&D incentive shift, named specific companies at risk, and quantified the price growth headwind. This is the level of specificity Leerink expects.',quality:'good',xp:30},
  {text:'IRA is bad for pharma because the government is going to negotiate drug prices down.',result:'Directionally correct but far too simplistic. An interviewer wants nuance: which companies are most affected, how does the small molecule vs. biologic distinction matter, what are the second-order effects on R&D incentives.',quality:'bad',xp:5},
  {text:'The impact is limited because only a small number of drugs are being negotiated, and pharma companies can adjust by raising prices on non-negotiated drugs.',result:'Partially correct -- the initial scope is limited. But the inflation rebate provisions specifically prevent excess price increases on existing drugs. You need to address the rebate mechanism and the R&D incentive distortion.',quality:'meh',xp:10}
])}`,

()=>`<div class="bx in">
  <h2 style="font-size:1.3em">The Pushback Round</h2>
  ${D('md',"Great analysts don't just have views -- they defend them under pressure. Here's where we test your conviction.")}

${mkSc('c7sc3','You just pitched LLY as a buy. The interviewer pushes back: "Lilly trades at 60x forward earnings. Isn\\'t all the GLP-1 upside already priced in?"',[
  {text:'Fair point on valuation. But I\\'d argue the consensus estimates still underestimate the TAM. Street is modeling $40-50B in GLP-1 revenue by 2030, but if you include cardiovascular, sleep apnea, NASH, and kidney indications, the real number could be $70B+. The multiple compresses as revenue grows into the valuation -- similar to how ISRG maintained a premium multiple as robotic surgery expanded.',result:'Excellent pushback handling. You acknowledged the concern, reframed with TAM expansion logic, and used a relevant comp (ISRG) to justify premium valuation. Showing you can defend under pressure is critical.',quality:'good',xp:25},
  {text:'You might be right. Maybe I should look at cheaper pharma names instead.',result:'Never fold immediately on pushback. The interviewer is testing your conviction and ability to defend a thesis. You can acknowledge risks while maintaining your view with supporting evidence.',quality:'bad',xp:3},
  {text:'60x is high but growth justifies it. Lilly is growing revenue 30%+ year-over-year.',result:'Decent but needs more depth. Why will growth sustain? What are the TAM expansion catalysts? Give the interviewer specifics that challenge their concern rather than just restating the growth number.',quality:'meh',xp:8}
])}
${mkSc('c7sc4','Interviewer: "If you had to pitch me one healthcare stock to short right now, what would it be?"',[
  {text:'I\\'d short a pure-play bariatric surgery device company or a mid-cap NASH drug developer without cardiovascular data. The GLP-1 revolution structurally impairs bariatric surgery volumes, and for NASH, GLP-1s with cardiovascular outcomes data will likely be the first-line treatment, making standalone NASH drugs a harder commercial proposition. The risk/reward is skewed to the downside for companies that haven\\'t adapted.',result:'Outstanding short thesis. You connected GLP-1 disruption to specific sub-sector losers, showed understanding of competitive dynamics, and framed it as structural rather than cyclical. This demonstrates creative, second-order thinking.',quality:'good',xp:25},
  {text:'I would short Tesla because it\\'s overvalued.',result:'This is a healthcare interview. Always keep your answer in the healthcare sector. Even if you think a non-healthcare stock is a better short, demonstrate your domain expertise.',quality:'bad',xp:0},

])}`

];

const FLASHCARDS=[
  {front:'Risk-Adjusted NPV (rNPV)',back:'Valuation method for pipeline drugs. Estimate peak sales, build a revenue ramp, apply probability of success at each clinical stage, and discount to present value. The standard for valuing pre-revenue biotech assets.'},
  {front:'Medical Loss Ratio (MLR)',back:'Percentage of insurance premium revenue spent on actual medical claims. Key metric for managed care companies (UNH, ELV, HUM). Target range: 80-85%. Lower MLR = more profitable insurer.'},
  {front:'PDUFA Date',back:'Prescription Drug User Fee Act date -- the FDA\'s deadline to act on a drug application. Typically 10 months (standard) or 6 months (priority review) after filing. A key binary catalyst for biotech stocks.'},
  {front:'Loss of Exclusivity (LOE)',back:'When a drug\'s patent protection expires, allowing generic/biosimilar competition. Revenue can drop 70-90% for small molecules and 30-50% for biologics over subsequent years. Large-cap pharma\'s biggest recurring strategic challenge.'},
  {front:'Sum-of-the-Parts (SOTP)',back:'Valuation approach that values each pipeline asset separately using rNPV, adds cash, subtracts debt and burn, then sums to get total equity value. Standard for multi-asset biotech companies.'},
  {front:'GLP-1 Receptor Agonist',back:'A class of drugs that mimics the GLP-1 gut hormone, stimulating insulin, slowing gastric emptying, and reducing appetite. Key drugs: semaglutide (Novo), tirzepatide (Lilly). Obesity market projected >$100B by 2030.'},
  {front:'Hazard Ratio (HR)',back:'Ratio of event rates between treatment and control groups. HR < 1.0 means treatment is better. HR 0.80 = 20% risk reduction. If 95% CI crosses 1.0, the result is NOT statistically significant.'},
  {front:'Intent-to-Treat (ITT)',back:'Clinical trial analysis that includes ALL randomized patients regardless of compliance or dropout. FDA-preferred method. More conservative than per-protocol. If a company only shows PP data, be skeptical.'},
  {front:'Biosimilar',back:'A biologic drug that is "highly similar" to an approved reference biologic. Not identical (unlike generic small molecules). Price discounts typically 15-35%. Slower adoption than generics due to complexity and rebate dynamics.'},

// =========== CONDITIONING MODE ===========
let condMode=null;
let condTimer=null;
let condTimeLeft=0;
let condTotal=0;
let condCorrect=0;
let condCurrent=null;
let leitnerBoxes={1:[],2:[],3:[],4:[],5:[]};

function goCond(){
  M().innerHTML=`<div class="in">
  <h2>Conditioning Mode</h2>
  <p style="color:var(--dim);margin-bottom:16px">Six cognitive science-based training modes to build deep, lasting knowledge.</p>

    <button class="cond-btn" onclick="startCond('speed')"><strong>Speed Round</strong><br><span style="color:var(--dim);font-size:.9em">6s easy / 4s hard -- rapid-fire healthcare facts</span></button>
    <button class="cond-btn" onclick="startCond('recall')"><strong>Active Recall</strong><br><span style="color:var(--dim);font-size:.9em">10s timer -- type the answer from memory</span></button>
    <button class="cond-btn" onclick="startCond('interleave')"><strong>Interleaving</strong><br><span style="color:var(--dim);font-size:.9em">Mixed topics to strengthen cross-connections</span></button>
    <button class="cond-btn" onclick="startCond('pressure')"><strong>Interview Pressure</strong><br><span style="color:var(--dim);font-size:.9em">8s timer -- behavioral + technical mixed</span></button>
    <button class="cond-btn" onclick="startCond('spaced')"><strong>Spaced Repetition</strong><br><span style="color:var(--dim);font-size:.9em">Leitner box system tracking mastery</span></button>
    <button class="cond-btn" onclick="startCond('weak')"><strong>Weak Spots</strong><br><span style="color:var(--dim);font-size:.9em">Focuses on items you've missed most</span></button>
  </div>
  <div class="br" style="justify-content:center"><button class="btn btn-g" onclick="goMenu()">Back to Menu</button></div>
  </div>`;
}

function getCondItems(mode){
  let pool=[];
  if(mode==='speed'){
    pool=COND_ITEMS.filter(i=>i.opts&&!i.type);
  }else if(mode==='recall'){
    pool=COND_ITEMS.filter(i=>i.type==='recall');
  }else if(mode==='interleave'){
    pool=COND_ITEMS.filter(i=>i.opts&&!i.type);
  }else if(mode==='pressure'){
    pool=COND_ITEMS.filter(i=>i.type==='pressure'||i.type==='recall');
  }else if(mode==='spaced'){
    initLeitner();
    return null; // handled separately
  }else if(mode==='weak'){
    const missed=Object.entries(S.condMisses).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(missed.length===0){
      return COND_ITEMS.filter(i=>i.opts&&!i.type).sort(()=>Math.random()-.5).slice(0,10);
    }
    const ids=missed.map(m=>m[0]);
    pool=COND_ITEMS.filter(i=>ids.includes(i.id));
    if(pool.length<5){
      const extra=COND_ITEMS.filter(i=>!ids.includes(i.id)&&i.opts&&!i.type).sort(()=>Math.random()-.5).slice(0,5);
      pool=pool.concat(extra);
    }
  }
  return pool.sort(()=>Math.random()-.5).slice(0,12);
}

function startCond(mode){
  condMode=mode;condTotal=0;condCorrect=0;
  if(mode==='spaced'){initLeitner();renderLeitner();return;}
  const items=getCondItems(mode);
  if(!items||items.length===0){toast('No items available for this mode','r');return;}
  window._condQueue=items;
  window._condIdx=0;
  renderCondItem();
}

function renderCondItem(){
  const items=window._condQueue;
  const idx=window._condIdx;
  if(!items||idx>=items.length){
    finishCond();return;
  }
  const item=items[idx];
  condCurrent=item;
  let timeLimit=0;
  if(condMode==='speed')timeLimit=item.diff==='easy'?6000:4000;
  else if(condMode==='recall')timeLimit=10000;
  else if(condMode==='pressure')timeLimit=8000;
  else if(condMode==='interleave')timeLimit=7000;
  else if(condMode==='weak')timeLimit=6000;

  let h=`<div class="in">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:.7em;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple);font-weight:700">${condMode.toUpperCase()} MODE</span>
    <span style="color:var(--dim);font-size:.82em">${idx+1}/${items.length} | Score: ${condCorrect}/${condTotal}</span>
  </div>`;

  if(timeLimit>0){
    h+=`<div class="timer-bar"><div class="timer-fill green" id="condTimerBar" style="width:100%"></div></div>`;
  }

  if(item.type==='recall'||item.type==='pressure'){
    h+=`<div class="bx"><div class="qz-q">${item.q}</div>
    <input class="recall-input" id="recallInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')submitRecall()">
    <div class="br"><button class="btn btn-b" onclick="submitRecall()">Submit</button>
    <button class="btn btn-g" onclick="revealRecall()">Show Answer</button></div>
    <div id="recallResult" class="hidden"></div></div>`;
  }else{
    const sh=item.opts.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
    window._condSh=sh;
    const L='ABCD';
    h+=`<div class="qz"><div class="qz-q">${item.q}</div>
    <div class="os">${sh.map((o,i)=>`<button class="o" id="co${i}" onclick="condAnswer(${i})">${'<span class="lt">'+L[i]+'</span><span>'+o.t+'</span>'}</button>`).join('')}</div>
    <div id="condExp" class="hidden"></div></div>`;
  }

  h+=`<div class="br" style="justify-content:center;margin-top:8px"><button class="btn btn-g" onclick="goCond()">Quit</button></div></div>`;
  M().innerHTML=h;

  if(timeLimit>0)startCondTimer(timeLimit);
  if(item.type==='recall'||item.type==='pressure'){
    setTimeout(()=>{const inp=$('recallInput');if(inp)inp.focus()},100);
  }
}

function startCondTimer(ms){
  clearInterval(condTimer);
  condTimeLeft=ms;
  const total=ms;
  condTimer=setInterval(()=>{
    condTimeLeft-=100;
    const bar=$('condTimerBar');
    if(bar){
      const pct=Math.max(0,condTimeLeft/total*100);
      bar.style.width=pct+'%';
      bar.className='timer-fill '+(pct>50?'green':pct>20?'yellow':'red');
    }
    if(condTimeLeft<=0){
      clearInterval(condTimer);
      condTimedOut();
    }
  },100);
}

function condTimedOut(){
  if(condCurrent.type==='recall'||condCurrent.type==='pressure'){
    revealRecall(true);
  }else{
    document.querySelectorAll('[id^="co"]').forEach(b=>{b.classList.add('lk');b.onclick=null});
    const sh=window._condSh;
    sh.forEach((o,i)=>{if(o.i===condCurrent.ci)$('co'+i).classList.add('ok')});
    condTotal++;recordMiss(condCurrent.id);
    toast('Time\\'s up!','r');
    $('condExp').innerHTML=`<div class="qz-e"><strong style="color:var(--red)">Time's up!</strong> The answer was: ${condCurrent.a||condCurrent.opts[condCurrent.ci]}</div>`;
    $('condExp').classList.remove('hidden');
    setTimeout(()=>{window._condIdx++;renderCondItem()},2000);
  }
}

window.condAnswer=function(pk){
  clearInterval(condTimer);
  const sh=window._condSh;
  const ok=sh[pk].i===condCurrent.ci;
  condTotal++;if(ok){condCorrect++;recordHit(condCurrent.id)}else{recordMiss(condCurrent.id)}
  ding(ok);
  sh.forEach((o,i)=>{const b=$('co'+i);b.classList.add('lk');b.onclick=null;if(o.i===condCurrent.ci)b.classList.add('ok');else if(i===pk)b.classList.add('no')});
  $('condExp').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Correct!</strong>':'<strong style="color:var(--red)">Wrong.</strong> The answer is: '+(condCurrent.a||condCurrent.opts[condCurrent.ci])}</div>`;
  $('condExp').classList.remove('hidden');
  setTimeout(()=>{window._condIdx++;renderCondItem()},1800);
};

window.submitRecall=function(){
  clearInterval(condTimer);
  const inp=$('recallInput');
  if(!inp)return;
  const ans=inp.value.trim();
  if(!ans)return;
  inp.disabled=true;
  condTotal++;
  // Show correct answer for self-evaluation
  $('recallResult').innerHTML=`<div class="qz-e" style="margin-top:12px">
    <strong style="color:var(--cyan)">Correct answer:</strong><br>${condCurrent.a}
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn btn-b" onclick="recallSelfScore(true)" style="font-size:.8em">I Got It Right</button>
      <button class="btn btn-g" onclick="recallSelfScore(false)" style="font-size:.8em">I Got It Wrong</button>
    </div>
  </div>`;
  $('recallResult').classList.remove('hidden');
};

window.revealRecall=function(timedOut){
  clearInterval(condTimer);
  const inp=$('recallInput');if(inp)inp.disabled=true;
  condTotal++;recordMiss(condCurrent.id);
  if(timedOut)toast('Time\\'s up!','r');
  $('recallResult').innerHTML=`<div class="qz-e" style="margin-top:12px">
    <strong style="color:var(--red)">${timedOut?'Time\\'s up!':'Revealed'}</strong><br>${condCurrent.a}
    <div style="margin-top:10px"><button class="btn btn-b" onclick="window._condIdx++;renderCondItem()" style="font-size:.8em">Next</button></div>
  </div>`;
  $('recallResult').classList.remove('hidden');
};

window.recallSelfScore=function(correct){
  if(correct){condCorrect++;ding(true);recordHit(condCurrent.id)}else{ding(false);recordMiss(condCurrent.id)}
  setTimeout(()=>{window._condIdx++;renderCondItem()},800);
};

function finishCond(){
  clearInterval(condTimer);
  const pct=condTotal?Math.round(condCorrect/condTotal*100):0;
  M().innerHTML=`<div class="bx in tc">
    <h2 style="color:var(--purple)">Conditioning Complete!</h2>
    <p>Mode: <strong>${condMode.toUpperCase()}</strong></p>
    <div class="rs"><div class="rs-i"><div class="rs-v" style="color:var(--green)">${condCorrect}/${condTotal}</div><div class="rs-l">Correct</div></div>
    <div class="rs-i"><div class="rs-v" style="color:var(--cyan)">${pct}%</div><div class="rs-l">Accuracy</div></div>
    <div class="rs-i"><div class="rs-v" style="color:var(--gold)">${S.xp}</div><div class="rs-l">Total XP</div></div></div>
    <div class="br" style="justify-content:center"><button class="btn btn-g" onclick="goCond()">More Training</button><button class="btn btn-b" onclick="goMenu()">Menu</button></div></div>`;
}

// =========== LEITNER SPACED REPETITION ===========
function initLeitner(){
  try{
    const saved=JSON.parse(localStorage.getItem('leerink_v2_leitner'));
    if(saved){leitnerBoxes=saved;return;}
  }catch(e){}
  leitnerBoxes={1:[],2:[],3:[],4:[],5:[]};
  const pool=COND_ITEMS.filter(i=>i.opts&&!i.type);
  pool.forEach(item=>{leitnerBoxes[1].push(item.id)});
  saveLeitner();
}
function saveLeitner(){try{localStorage.setItem('leerink_v2_leitner',JSON.stringify(leitnerBoxes))}catch(e){}}

function renderLeitner(){
  const counts=Object.keys(leitnerBoxes).map(k=>leitnerBoxes[k].length);
  // Pick from lowest non-empty box
  let box=1;
  for(let b=1;b<=5;b++){if(leitnerBoxes[b].length>0){box=b;break;}}
  const pool=leitnerBoxes[box];
  if(pool.length===0){
    M().innerHTML=`<div class="bx in tc"><h2 style="color:var(--green)">All Mastered!</h2><p>Every item has been promoted to Box 5. You're ready.</p>
    <div class="br" style="justify-content:center"><button class="btn btn-g" onclick="resetLeitner()">Reset Boxes</button><button class="btn btn-b" onclick="goCond()">Back</button></div></div>`;
    return;
  }

  const itemId=pool[Math.floor(Math.random()*pool.length)];
  const item=COND_ITEMS.find(i=>i.id===itemId);
  if(!item){pool.splice(pool.indexOf(itemId),1);saveLeitner();renderLeitner();return;}
  condCurrent=item;
  window._leitnerBox=box;

  let h=`<div class="in">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:.7em;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple);font-weight:700">SPACED REPETITION</span>
    <span style="color:var(--dim);font-size:.82em">Box ${box}</span>
  </div>
  <div class="leitner-boxes">${[1,2,3,4,5].map(b=>`<div class="lbox" style="${b===box?'border-color:var(--purple)':''}"><div class="lbox-n">${leitnerBoxes[b].length}</div><div class="lbox-l">Box ${b}</div></div>`).join('')}</div>`;

  const sh=item.opts.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  window._condSh=sh;
  const L='ABCD';
  h+=`<div class="qz"><div class="qz-q">${item.q}</div>
  <div class="os">${sh.map((o,i)=>`<button class="o" id="co${i}" onclick="leitnerAnswer(${i})">${'<span class="lt">'+L[i]+'</span><span>'+o.t+'</span>'}</button>`).join('')}</div>
  <div id="condExp" class="hidden"></div></div>`;
  h+=`<div class="br" style="justify-content:center;margin-top:8px"><button class="btn btn-g" onclick="goCond()">Quit</button></div></div>`;
  M().innerHTML=h;
}

window.leitnerAnswer=function(pk){
  const sh=window._condSh;
  const ok=sh[pk].i===condCurrent.ci;
  const box=window._leitnerBox;
  ding(ok);

  // Move item between boxes
  const itemId=condCurrent.id;
  leitnerBoxes[box]=leitnerBoxes[box].filter(id=>id!==itemId);
  if(ok){
    const newBox=Math.min(box+1,5);
    leitnerBoxes[newBox].push(itemId);
    recordHit(itemId);
  }else{
    leitnerBoxes[1].push(itemId);
    recordMiss(itemId);
  }
  saveLeitner();

  sh.forEach((o,i)=>{const b=$('co'+i);b.classList.add('lk');b.onclick=null;if(o.i===condCurrent.ci)b.classList.add('ok');else if(i===pk)b.classList.add('no')});
  const moveMsg=ok?`Promoted to Box ${Math.min(box+1,5)}`:'Sent back to Box 1';
  $('condExp').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Correct!</strong> '+moveMsg:'<strong style="color:var(--red)">Wrong.</strong> '+moveMsg+'. The answer is: '+(condCurrent.a||condCurrent.opts[condCurrent.ci])}</div>`;
  $('condExp').classList.remove('hidden');
  setTimeout(()=>renderLeitner(),2000);
};

window.resetLeitner=function(){
  leitnerBoxes={1:[],2:[],3:[],4:[],5:[]};
  COND_ITEMS.filter(i=>i.opts&&!i.type).forEach(item=>{leitnerBoxes[1].push(item.id)});
  saveLeitner();
  renderLeitner();
};

// =========== INIT ===========
window.goMenu=goMenu;
window.goCh=goCh;
window.nextStep=nextStep;
window.renderStep=renderStep;
window.goFlash=goFlash;
window.renderFlash=renderFlash;
window.goCond=goCond;
window.startCond=startCond;
window.renderCondItem=renderCondItem;
window.renderLeitner=renderLeitner;
window.finishCond=finishCond;

goMenu();
upd();
</script>
