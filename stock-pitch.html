<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Pitch Bootcamp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap');
:root{
  --bg:#08090d;--card:#10131a;--card2:#161b26;--border:#1e2536;
  --text:#c9d1d9;--dim:#6b7b8d;--bright:#ecf0f5;
  --blue:#3b82f6;--blue-d:rgba(59,130,246,.15);
  --cyan:#22d3ee;--cyan-d:rgba(34,211,238,.1);
  --green:#34d399;--green-d:rgba(52,211,153,.12);
  --gold:#fbbf24;--gold-d:rgba(251,191,36,.12);
  --red:#f87171;--red-d:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-d:rgba(167,139,250,.1);
  --orange:#fb923c;--orange-d:rgba(251,146,60,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.amb{position:fixed;pointer-events:none;z-index:0}
.a1{top:-30%;right:-15%;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.06),transparent 70%)}
.a2{bottom:-20%;left:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.04),transparent 70%)}
#app{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:14px 18px 60px}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.logo{font-family:'Playfair Display',serif;font-size:1.05em;font-weight:800;color:var(--bright)}.logo span{color:var(--blue)}
.badge{font-size:.6em;background:var(--blue-d);color:var(--blue);padding:2px 8px;border-radius:8px;font-weight:600;letter-spacing:.5px;margin-left:8px}
.stats{display:flex;gap:16px}
.st{text-align:center}.st-v{font-size:1em;font-weight:800}.st-l{font-size:.55em;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.st-v.xp{color:var(--cyan)}.st-v.str{color:var(--gold)}.st-v.ch{color:var(--green)}

.pips{display:flex;gap:3px;margin:8px 0 14px}
.pip{height:4px;flex:1;border-radius:2px;background:var(--border);transition:.4s}
.pip.done{background:var(--green)}.pip.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}

.in{animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 22px;border-radius:10px;font-size:.85em;font-weight:700;animation:toastIn .4s ease,toastOut .4s ease 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.toast-g{background:var(--green-d);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.toast-r{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.toast-b{background:var(--gold-d);color:var(--gold);border:1px solid rgba(251,191,36,.3)}

.bx{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:12px}
.bx2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:12px 0;position:relative;overflow:hidden}
.bx2::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:3px}
.bx2.bl::before{background:var(--blue)}.bx2.gr::before{background:var(--green)}.bx2.go::before{background:var(--gold)}.bx2.cy::before{background:var(--cyan)}.bx2.pu::before{background:var(--purple)}.bx2.re::before{background:var(--red)}.bx2.or::before{background:var(--orange)}
.tag{font-size:.6em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:5px;display:block}
.tag-bl{color:var(--blue)}.tag-gr{color:var(--green)}.tag-go{color:var(--gold)}.tag-cy{color:var(--cyan)}.tag-pu{color:var(--purple)}.tag-re{color:var(--red)}.tag-or{color:var(--orange)}
h2{font-family:'Playfair Display',serif;font-size:1.7em;font-weight:800;color:var(--bright);line-height:1.2;margin-bottom:10px}
h4{font-size:.98em;color:var(--bright);margin-bottom:5px}
p,li{font-size:.88em;line-height:1.75;margin-bottom:8px}
ul{padding-left:16px}li{margin-bottom:4px}
.chap-tag{font-size:.68em;text-transform:uppercase;letter-spacing:2px;color:var(--blue);font-weight:700;margin-bottom:5px}
.hl{color:var(--cyan);font-weight:600}
.an{color:var(--cyan);border-left:2px solid var(--cyan);padding:6px 0 6px 14px;margin:10px 0;font-size:.88em;line-height:1.7;font-style:italic}
.funny{color:var(--gold);font-size:.82em;margin-top:4px;font-style:italic}

.dl{display:flex;gap:10px;margin:12px 0;animation:up .3s}
.dl-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex-shrink:0;border:2px solid var(--border)}
.dl-av.you{background:linear-gradient(135deg,#3f3a1e,#6c5a2d);border-color:var(--gold);color:var(--gold)}
.dl-av.coach{background:linear-gradient(135deg,#1e3f1e,#2d6c2d);border-color:var(--green);color:var(--green)}
.dl-av.int{background:linear-gradient(135deg,#1e1e3f,#2d2d6c);border-color:var(--purple);color:var(--purple)}
.dl-bb{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 14px;flex:1}
.dl-n{font-size:.7em;font-weight:700;margin-bottom:2px}
.dl-n.you{color:var(--gold)}.dl-n.coach{color:var(--green)}.dl-n.int{color:var(--purple)}
.dl-t{font-size:.86em;line-height:1.6}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:10px;font-family:inherit;font-weight:600;font-size:.86em;cursor:pointer;transition:.2s;border:none}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{box-shadow:0 0 20px rgba(59,130,246,.3);transform:translateY(-1px)}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-g:hover{border-color:var(--blue);color:var(--blue)}
.br{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.qz{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin:12px 0;animation:up .3s}
.qz-tag{font-size:.6em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px}
.qz-q{font-size:1.02em;font-weight:600;color:var(--bright);line-height:1.5;margin-bottom:14px}
.os{display:flex;flex-direction:column;gap:7px}
.o{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.2s;font-size:.86em;display:flex;align-items:center;gap:10px;font-family:inherit;color:var(--text);text-align:left;width:100%}
.o:hover:not(.lk){border-color:var(--blue);background:var(--blue-d)}
.o .lt{min-width:25px;height:25px;border-radius:7px;background:rgba(59,130,246,.1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;flex-shrink:0}
.o.ok{border-color:var(--green)!important;background:var(--green-d)!important;animation:pop .3s}.o.ok .lt{background:var(--green);color:#000}
.o.no{border-color:var(--red)!important;background:var(--red-d)!important;animation:shake .3s}.o.no .lt{background:var(--red);color:#fff}
.o.lk{cursor:default;opacity:.55}
.qz-e{margin-top:11px;padding:13px;background:var(--cyan-d);border:1px solid rgba(34,211,238,.15);border-radius:10px;font-size:.84em;line-height:1.7;animation:up .3s}
.qz-e strong{color:var(--cyan)}

.sc-wrap{margin:12px 0}
.sc-choice{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;transition:.2s;margin-bottom:7px;font-size:.88em;line-height:1.5;font-family:inherit;color:var(--text);text-align:left;width:100%;display:block}
.sc-choice:hover:not(.lk){border-color:var(--gold);background:var(--gold-d)}
.sc-choice.picked{border-color:var(--green);background:var(--green-d)}
.sc-choice.lk{cursor:default;opacity:.5}
.sc-result{padding:14px;border-radius:10px;margin-top:10px;font-size:.85em;line-height:1.7;animation:up .3s}
.sc-result.good{background:var(--green-d);border:1px solid rgba(52,211,153,.2);color:var(--green)}
.sc-result.meh{background:var(--gold-d);border:1px solid rgba(251,191,36,.2);color:var(--gold)}
.sc-result.bad{background:var(--red-d);border:1px solid rgba(248,113,113,.2);color:var(--red)}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.m-item{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.2s;font-size:.82em;text-align:center;font-family:inherit;color:var(--text);min-height:48px;display:flex;align-items:center;justify-content:center}
.m-item:hover:not(.lk):not(.matched){border-color:var(--blue);background:var(--blue-d)}
.m-item.sel{border-color:var(--gold);background:var(--gold-d);color:var(--gold)}
.m-item.matched{border-color:var(--green);background:var(--green-d);color:var(--green);cursor:default;opacity:.7}
.m-item.wrong{animation:shake .3s;border-color:var(--red)}
.m-item.lk{cursor:default}

.tf-wrap{display:flex;gap:8px;margin-top:10px}
.tf-btn{flex:1;padding:14px;border-radius:12px;font-family:inherit;font-weight:700;font-size:1em;cursor:pointer;border:2px solid var(--border);background:var(--card2);transition:.2s;color:var(--text)}
.tf-btn:hover:not(.lk){transform:translateY(-2px)}
.tf-btn.t:hover:not(.lk){border-color:var(--green);color:var(--green);background:var(--green-d)}
.tf-btn.f:hover:not(.lk){border-color:var(--red);color:var(--red);background:var(--red-d)}
.tf-btn.ok{border-color:var(--green)!important;background:var(--green-d)!important;color:var(--green)!important}
.tf-btn.no{border-color:var(--red)!important;background:var(--red-d)!important;color:var(--red)!important}
.tf-btn.lk{cursor:default;opacity:.5}

.ch-grid{display:grid;gap:8px;margin:14px 0}
.ch-i{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:12px}
.ch-i:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.07)}
.ch-i.lk{opacity:.35;cursor:default}.ch-i.lk:hover{border-color:var(--border);transform:none;box-shadow:none}
.ch-i.dn{border-color:rgba(52,211,153,.25)}
.ch-ic{font-size:1.5em;width:38px;text-align:center}
.ch-inf{flex:1}.ch-nm{font-weight:700;font-size:.9em;color:var(--bright)}.ch-ds{font-size:.75em;color:var(--dim);margin-top:1px}
.ch-st{font-size:.65em;font-weight:600;padding:3px 9px;border-radius:7px}
.ch-st.dn{background:var(--green-d);color:var(--green)}.ch-st.nw{background:var(--blue-d);color:var(--blue)}.ch-st.lk{background:rgba(107,123,141,.08);color:var(--dim)}

.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.rs-i{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.rs-v{font-size:1.2em;font-weight:800}.rs-l{font-size:.6em;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-top:2px}

.fcc{perspective:1000px;margin:14px 0;cursor:pointer}
.fcrd{width:100%;min-height:200px;position:relative;transition:transform .6s;transform-style:preserve-3d}
.fcrd.fl{transform:rotateX(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}
.fcfr{background:linear-gradient(135deg,#1a2744,#1e3a5c);border:1px solid rgba(59,130,246,.2)}
.fcbk{background:var(--card);border:1px solid var(--border);transform:rotateX(180deg);text-align:left;align-items:flex-start}
.fcfr h3{font-size:1.15em;color:var(--bright);font-family:'Playfair Display',serif}
.fch{font-size:.72em;color:var(--dim);margin-top:8px}
.fcbk p{font-size:.86em;line-height:1.7}

/* Conditioning Mode */
.cm-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:10px 0}
.cm-fill{height:100%;border-radius:3px;transition:width .3s;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.cm-timer{font-size:2.2em;font-weight:900;font-family:'Playfair Display',serif;text-align:center;margin:8px 0}
.cm-timer.warn{color:var(--gold);animation:pop .3s}.cm-timer.crit{color:var(--red);animation:shake .4s}
.cm-prompt{font-size:1.1em;font-weight:700;color:var(--bright);text-align:center;line-height:1.5;margin:14px 0}
.cm-input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--bright);font-family:inherit;font-size:1em;text-align:center;outline:none;transition:.2s}
.cm-input:focus{border-color:var(--blue);box-shadow:0 0 16px rgba(59,130,246,.15)}
.cm-input.ok{border-color:var(--green)!important;background:var(--green-d)!important}
.cm-input.no{border-color:var(--red)!important;background:var(--red-d)!important;animation:shake .3s}
.cm-sci{font-size:.7em;color:var(--dim);padding:8px 12px;background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.12);border-radius:8px;margin:8px 0;line-height:1.6}
.cm-sci strong{color:var(--purple)}
.cm-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cm-opt{padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:var(--card2);cursor:pointer;font-family:inherit;font-size:.92em;font-weight:600;color:var(--text);text-align:center;transition:.15s}
.cm-opt:hover:not(.lk){border-color:var(--blue);background:var(--blue-d);transform:translateY(-1px)}
.cm-opt.ok{border-color:var(--green)!important;background:var(--green-d)!important;color:var(--green)!important;animation:pop .3s}
.cm-opt.no{border-color:var(--red)!important;background:var(--red-d)!important;color:var(--red)!important;animation:shake .3s}
.cm-opt.lk{cursor:default;opacity:.5}
.cm-diff{display:flex;gap:6px;justify-content:center;margin:12px 0}
.cm-diff-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-family:inherit;font-size:.8em;font-weight:600;color:var(--text);transition:.15s}
.cm-diff-btn:hover{transform:translateY(-1px)}
.cm-diff-btn.easy{border-color:rgba(52,211,153,.3);color:var(--green)}.cm-diff-btn.easy:hover{background:var(--green-d)}
.cm-diff-btn.hard{border-color:rgba(248,113,113,.3);color:var(--red)}.cm-diff-btn.hard:hover{background:var(--red-d)}
.cm-diff-btn.mid{border-color:rgba(251,191,36,.3);color:var(--gold)}.cm-diff-btn.mid:hover{background:var(--gold-d)}
.cm-streak-bar{display:flex;gap:4px;justify-content:center;margin:8px 0}
.cm-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:.3s}
.cm-dot.hit{background:var(--green);box-shadow:0 0 6px var(--green)}.cm-dot.miss{background:var(--red)}
.cm-phase{font-size:.65em;text-transform:uppercase;letter-spacing:2px;font-weight:700;text-align:center;margin-bottom:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.cm-live{animation:pulse 1s infinite}

.hidden{display:none!important}.tc{text-align:center}
@media(max-width:600px){h2{font-size:1.35em}#app{padding:10px 12px 50px}.match-grid{grid-template-columns:1fr}.rs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div>
<div id="app">
  <div class="top">
    <div style="display:flex;align-items:center"><div class="logo">Stock Pitch <span>Bootcamp</span></div><span class="badge">MASTER THE PITCH</span></div>
    <div class="stats">
      <div class="st"><div class="st-v xp" id="xp">0</div><div class="st-l">XP</div></div>
      <div class="st"><div class="st-v str" id="str">0</div><div class="st-l">Streak</div></div>
      <div class="st"><div class="st-v ch" id="chdone">0/6</div><div class="st-l">Done</div></div>
    </div>
  </div>
  <div class="pips" id="pips"></div>
  <div id="m"></div>
</div>
<script>
const _saved=JSON.parse(localStorage.getItem('stock_pitch_prep')||'null');
const S=_saved?{..._saved,done:new Set(_saved.done)}:{xp:0,str:0,mx:0,ok:0,tot:0,ch:-1,st:0,done:new Set(),fcIdx:0};
function save(){localStorage.setItem('stock_pitch_prep',JSON.stringify({...S,done:[...S.done]}))};
const $=id=>document.getElementById(id);
const M=()=>$('m');
const upd=()=>{$('xp').textContent=S.xp;$('str').textContent=S.str;$('chdone').textContent=S.done.size+'/'+CH.length;
let p='';for(let i=0;i<CH.length;i++)p+=`<div class="pip ${S.done.has(i)?'done':S.ch===i?'on':''}"></div>`;$('pips').innerHTML=p};

function toast(msg,type='g'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function ding(ok){S.tot++;if(ok){S.ok++;S.str++;if(S.str>S.mx)S.mx=S.str;const b=Math.min(S.str,5);S.xp+=10+b*2;
if(S.str===3)toast('3x Streak!','b');if(S.str===5)toast('5x Streak! On fire!','b');if(S.str===8)toast('8x STREAK! UNSTOPPABLE!','b');
}else S.str=0;upd();save()}

function D(w,t){
  const av={you:'YOU',coach:'C',int:'INT'};
  const nm={you:'You',coach:'Your Pitch Coach',int:'Interviewer'};
  return `<div class="dl"><div class="dl-av ${w}">${av[w]}</div><div class="dl-bb"><div class="dl-n ${w}">${nm[w]}</div><div class="dl-t">${t}</div></div></div>`;
}

// MINI-GAME BUILDERS
function mkQ(id,q,opts,ci,exp){
  const sh=opts.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  window['_sh_'+id]=sh;
  const L='ABCD';
  return `<div class="qz" id="${id}" data-exp="${exp}"><div class="qz-tag" style="color:var(--gold)">Knowledge Check</div>
  <div class="qz-q">${q}</div>
  <div class="os">${sh.map((o,i)=>`<button class="o" id="${id}${i}" onclick="doQ('${id}',${i},${ci})"><span class="lt">${L[i]}</span><span>${o.t}</span></button>`).join('')}</div>
  <div id="${id}e" class="hidden"></div></div>`;
}
window.doQ=function(id,pk,ci){
  const sh=window['_sh_'+id];const ok=sh[pk].i===ci;ding(ok);
  sh.forEach((o,i)=>{const b=$(id+i);b.classList.add('lk');b.onclick=null;if(o.i===ci)b.classList.add('ok');else if(i===pk)b.classList.add('no')});
  const exp=$(id).dataset.exp||'';
  $(id+'e').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Nailed it!</strong>':'<strong style="color:var(--red)">Not quite!</strong>'} ${exp}</div>`;
  $(id+'e').classList.remove('hidden');
};

function mkSc(id,prompt,choices){
  window['_sc_'+id]=choices;
  return `<div class="bx in" id="${id}"><div class="qz-tag" style="color:var(--orange)">What Would You Do?</div>
  <p style="font-size:.95em;font-weight:600;color:var(--bright);margin-bottom:12px">${prompt}</p>
  <div class="sc-wrap">${choices.map((c,i)=>`<button class="sc-choice" id="${id}c${i}" onclick="doSc('${id}',${i})">${c.text}</button>`).join('')}</div>
  <div id="${id}r" class="hidden"></div></div>`;
}
window.doSc=function(id,pk){
  const choices=window['_sc_'+id];if(!choices)return;
  const c=choices[pk];
  document.querySelectorAll(`[id^="${id}c"]`).forEach((b,i)=>{b.classList.add('lk');b.onclick=null;if(i===pk)b.classList.add('picked')});
  S.xp+=(c.xp||5);S.tot++;if(c.quality==='good')S.ok++;upd();
  $(id+'r').innerHTML=`<div class="sc-result ${c.quality}">${c.result}</div>`;
  $(id+'r').classList.remove('hidden');
  if(c.quality==='good')toast('+'+c.xp+' XP!');
};

function mkTF(id,statement,isTrue,exp){
  return `<div class="qz" id="${id}" data-exp="${exp}"><div class="qz-tag" style="color:var(--purple)">True or False?</div>
  <p style="font-size:1em;font-weight:600;color:var(--bright);line-height:1.5">${statement}</p>
  <div class="tf-wrap">
    <button class="tf-btn t" id="${id}t" onclick="doTF('${id}',true,${isTrue})">TRUE</button>
    <button class="tf-btn f" id="${id}f" onclick="doTF('${id}',false,${isTrue})">FALSE</button>
  </div>
  <div id="${id}e" class="hidden"></div></div>`;
}
window.doTF=function(id,picked,answer){
  const ok=picked===answer;ding(ok);
  $(id+'t').classList.add('lk');$(id+'f').classList.add('lk');
  $(id+'t').onclick=null;$(id+'f').onclick=null;
  if(answer)$(id+'t').classList.add('ok');else $(id+'f').classList.add('ok');
  if(!ok){if(picked)$(id+'t').classList.add('no');else $(id+'f').classList.add('no')}
  const exp=$(id).dataset.exp||'';
  $(id+'e').innerHTML=`<div class="qz-e">${ok?'<strong style="color:var(--green)">Correct!</strong>':'<strong style="color:var(--red)">Nope!</strong>'} ${exp}</div>`;
  $(id+'e').classList.remove('hidden');
};

function mkMatch(id,pairs){
  const lefts=pairs.map((p,i)=>({t:p.left,id:i})).sort(()=>Math.random()-.5);
  const rights=pairs.map((p,i)=>({t:p.right,id:i})).sort(()=>Math.random()-.5);
  window['_m_'+id]={lefts,rights,sel:null,matched:0,total:pairs.length};
  let h=`<div class="bx in" id="${id}"><div class="qz-tag" style="color:var(--cyan)">Match Game -- tap a left item, then its match on the right</div>
  <div class="match-grid">
    <div>${lefts.map((l,i)=>`<div class="m-item" id="${id}L${i}" onclick="doMatch('${id}','L',${i},${l.id})" style="margin-bottom:6px">${l.t}</div>`).join('')}</div>
    <div>${rights.map((r,i)=>`<div class="m-item" id="${id}R${i}" onclick="doMatch('${id}','R',${i},${r.id})" style="margin-bottom:6px">${r.t}</div>`).join('')}</div>
  </div>
  <div id="${id}msg" style="text-align:center;margin-top:8px;font-size:.82em;color:var(--dim)">Tap a term on the left, then its match on the right</div></div>`;
  return h;
}
window.doMatch=function(id,side,idx,pairId){
  const st=window['_m_'+id];if(!st)return;
  const el=$(id+side+idx);if(el.classList.contains('matched'))return;
  if(!st.sel){st.sel={side,idx,pairId,el};el.classList.add('sel');return}
  if(st.sel.side===side){st.sel.el.classList.remove('sel');if(st.sel.idx===idx){st.sel=null;return}
    st.sel={side,idx,pairId,el};el.classList.add('sel');return}
  const prev=st.sel;prev.el.classList.remove('sel');
  if(prev.pairId===pairId){prev.el.classList.add('matched');el.classList.add('matched');st.matched++;ding(true);
    if(st.matched===st.total){$(id+'msg').innerHTML='<span style="color:var(--green);font-weight:700">All matched! Nice work.</span>';toast('Perfect matching!')}
  }else{prev.el.classList.add('wrong');el.classList.add('wrong');ding(false);
    setTimeout(()=>{prev.el.classList.remove('wrong');el.classList.remove('wrong')},500)}
  st.sel=null;
};

()=>`<div class="bx in">
  <div class="chap-tag">Chapter 1 of 6</div>
  <h2>The Anatomy of a Pitch</h2>
  <p>Every great stock pitch -- whether you're interviewing at BMO, Leerink, Goldman, or a hedge fund -- follows the same fundamental structure. Master this framework and you can pitch <em>any</em> stock.</p>

</div>
<div class="bx2 bl">
  <span class="tag tag-bl">The Framework</span>
  <h4>The 5-Part Stock Pitch Structure</h4>
  <p>Think of a stock pitch like a legal argument. You need a clear claim, evidence, and you need to anticipate the opposing counsel's objections.</p>
  <ol>
    <li><strong class="hl">Company Overview</strong> -- What does this company do? One to two sentences. Set the stage so the interviewer knows what you're talking about.</li>
    <li><strong class="hl">Thesis / Why Now</strong> -- Your investment thesis. Why is this stock mispriced TODAY? What does the market not understand?</li>
    <li><strong class="hl">Key Catalysts</strong> -- What specific events will cause the stock to move in your direction? These need to be concrete and time-bound.</li>
    <li><strong class="hl">Valuation</strong> -- Is the stock cheap or expensive? How do you know? What's your target price or upside/downside?</li>
    <li><strong class="hl">Risks &amp; Mitigants</strong> -- What could go wrong, and why do you still believe in the thesis despite those risks?</li>
  </ol>
  <div class="an">The best pitches feel like a story. You're not just listing facts -- you're building a narrative about why the market is wrong and you're right.</div>
</div>
<div class="bx2 cy">

  <h4>Why "Why Now" Is the Most Important Part</h4>
  <p>Anyone can say "Costco is a great company." That's not a stock pitch. A stock pitch requires a <strong>variant perception</strong> -- a view that differs from what the market already believes.</p>
  <p>The "Why Now" answers: <em>If this is such a good idea, why hasn't the stock already moved?</em> Maybe there's an upcoming catalyst. Maybe the market is overreacting to short-term noise. Maybe there's a structural change that hasn't been fully priced in.</p>

</div>`,

// CH3: BUILDING THE BEAR CASE
{icon:'📉',name:'Building the Bear Case',desc:'Learn to construct a Short pitch -- the move that shows real sophistication.',
steps:[
()=>`<div class="bx in">
  <div class="chap-tag">Chapter 4 of 6</div>
  <h2>Building the Bear Case</h2>
  <p>Most candidates only prepare Long (buy) pitches. A well-constructed Short pitch demonstrates critical thinking, analytical depth, and the kind of skepticism that equity research teams value.</p>
  ${D('you',"I've never shorted a stock. Is it really expected in interviews?")}
  ${D('coach',"Not expected, but having one ready is a differentiator. Especially at Leerink (healthcare has tons of overvalued names) and for impressing Ben Wood at BMO, who came from Point72 -- a hedge fund that loves short ideas.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">Short Selling Basics</span>
  <h4>How Shorting Works</h4>
  <p>When you <strong>short</strong> a stock, you're betting the price will go DOWN. Mechanically: you borrow shares, sell them at today's price, then buy them back later (hopefully cheaper) to return them.</p>
  <ul>
    <li><strong>Profit:</strong> If stock drops from $50 to $30, you make $20/share</li>
    <li><strong>Loss:</strong> If stock rises from $50 to $80, you lose $30/share</li>
    <li><strong>Key risk:</strong> Losses are theoretically unlimited (stock can go to infinity). This is why timing and conviction matter more for shorts.</li>
  </ul>
  <div class="an">You don't need to actually short stocks to pitch a short. You just need to articulate why a stock is overvalued and what will cause the market to realize it. Think of it as a "sell/underperform" recommendation.</div>
</div>
<div class="bx2 go">
  <span class="tag tag-go">Example Short Pitch</span>
  <h4>Short: FreshCo Holdings (Hypothetical Consumer Staples Name)</h4>
  <p>Imagine a mid-cap packaged food company facing multiple headwinds:</p>
  <ul>
    <li><strong>Company:</strong> FreshCo Holdings -- a $5B market cap packaged snacks company trading at 22x forward earnings</li>
    <li><strong>Thesis:</strong> The market is overestimating FreshCo's ability to maintain margins. Private label penetration in their core snack categories has risen from 18% to 25% in two years, and GLP-1 adoption is reducing snack consumption by 10%+ among users.</li>
    <li><strong>Catalysts:</strong> Next earnings report will show volume declines accelerating; new private label launches from Walmart and Costco in their key categories; FreshCo's hedging contracts on cocoa and sugar roll off in Q2, exposing them to 40%+ commodity cost increases</li>
    <li><strong>Valuation:</strong> Trading at 22x on consensus EPS of $2.50, but if margins compress 200bps (our estimate), EPS drops to $2.10, meaning the stock is really at 26x -- expensive for a declining volume story</li>
    <li><strong>Risk to short:</strong> Activist investor could push for a sale; company could cut costs more aggressively than expected</li>
  </ul>
</div>`,

()=>`<div class="bx in">
  <h2 style="font-size:1.3em">Short-Specific Concepts</h2>
</div>
<div class="bx2 re">
  <span class="tag tag-re">Shorting Mechanics</span>
  <h4>Things You Must Know for Interviews</h4>
  <ul>
    <li><strong>Borrow cost:</strong> You pay a fee to borrow the shares you're shorting. Popular short targets can have borrow costs of 5-50%+ annualized, eating into your returns.</li>
    <li><strong>Short squeeze:</strong> If too many people are short and the stock rallies, shorts are forced to buy back (cover) to limit losses. This buying pushes the stock even higher, creating a vicious cycle. GameStop (GME) in 2021 was the most famous example.</li>
    <li><strong>Catalyst timing:</strong> Being early on a short is the same as being wrong. You need a catalyst within a reasonable timeframe (3-12 months) to justify the position.</li>
    <li><strong>Short interest:</strong> The percentage of a company's float that is currently sold short. High short interest (>15-20%) signals crowded positioning and squeeze risk.</li>
  </ul>
</div>
${mkQ('c3q0','What is a "short squeeze"?',
  ['When a company buys back its own shares','When too many shorts are forced to cover, pushing the stock higher in a feedback loop','When a stock\\'s price drops quickly due to selling pressure','When a company reduces its outstanding share count'],1,
  'A short squeeze occurs when a heavily shorted stock rallies, forcing short sellers to buy back shares to limit losses. This additional buying pressure drives the price even higher, forcing more shorts to cover. The GameStop saga in 2021 was a textbook example.')}
${mkTF('c3tf0',
  '"The maximum loss on a short position is the same as the maximum loss on a long position."',
  false,
  'On a long position, the most you can lose is 100% (stock goes to zero). On a short, your loss is <strong>theoretically unlimited</strong> because the stock price can rise infinitely. This asymmetric risk profile is why timing and risk management are even more critical for shorts.')}`,

()=>`<div class="bx in">
  <h2 style="font-size:1.3em">Short Pitch Structure</h2>
  ${D('coach',"A short pitch follows the same 5-part framework, but with some key differences in emphasis.")}
</div>
<div class="bx2 pu">
  <span class="tag tag-pu">Short-Specific Tips</span>
  <h4>How a Short Pitch Differs</h4>
  <ul>
    <li><strong>Catalyst is CRITICAL:</strong> For a long, you can be patient. For a short, you're paying borrow costs and facing squeeze risk. You need a clear, near-term catalyst for the stock to re-rate downward.</li>
    <li><strong>Quantify the downside:</strong> Don't just say "the stock will go down." Say "if margins compress 200bps, consensus EPS drops from $2.50 to $2.10, and at a fair 18x multiple, that's $37.80 vs. the current $55 -- 30% downside."</li>
    <li><strong>Address squeeze risk:</strong> Always mention the short interest level and why you believe the short isn't crowded.</li>
    <li><strong>Timeline:</strong> Give a clear timeline. "Over the next 2-3 quarters as hedging contracts roll off and private label share gains accelerate."</li>
  </ul>
  <div class="an">The best short pitches identify companies where the consensus is extrapolating a trend that is about to reverse. Look for deteriorating fundamentals that the market is still pricing as temporary.</div>
</div>
${mkQ('c3q1','Which factor is MOST important for a short pitch that isn\\'t as critical for a long pitch?',
  ['Company overview','Catalyst timing','Management quality','Brand strength'],1,
  '<strong>Catalyst timing</strong> is disproportionately important for shorts because you\\'re paying borrow costs every day you hold the position, and you face unlimited loss potential. Being early on a short is functionally the same as being wrong.')}
${mkTF('c3tf1',
  '"High short interest (>20% of float) makes a stock a BETTER short candidate because it means many smart investors agree it\\'s overvalued."',
  false,
  'High short interest actually makes a stock a <strong>worse</strong> short candidate due to squeeze risk. If sentiment shifts even slightly, the covering cascade can cause massive losses. The best shorts are <strong>uncrowded</strong> -- you see something the market hasn\\'t widely recognized yet.')}`
]},

{icon:'🎤',name:'The Delivery',desc:'How to present your pitch in 60-90 seconds and handle pushback.',
steps:[
()=>`<div class="bx in">
  <div class="chap-tag">Chapter 5 of 6</div>
  <h2>The Delivery</h2>
  <p>You've built the pitch. Now you need to deliver it under pressure, in a conversational interview setting, in 60-90 seconds. This is where most candidates fail -- not because they don't know the material, but because they can't communicate it clearly.</p>
  ${D('you',"I always freeze up when someone asks me for my stock idea. How do I stop rambling?")}
  ${D('coach',"Structure eliminates rambling. If you know the framework cold, your mouth just follows the structure. Let me give you the exact delivery formula.")}
</div>
<div class="bx2 bl">
  <span class="tag tag-bl">The 60-Second Formula</span>
  <h4>Hook -> Thesis -> Catalysts -> Valuation -> Risk + Mitigant</h4>
  <p>Memorize this flow. Practice it until it's muscle memory.</p>
  <ol>
    <li><strong class="hl">Hook (5 seconds):</strong> "My best idea is a long/short on [Company], ticker [TICK], currently trading at $[X]."</li>
    <li><strong class="hl">Thesis (15 seconds):</strong> One sentence on what the company does. Two sentences on why the market is wrong.</li>
    <li><strong class="hl">Catalysts (15 seconds):</strong> "Three catalysts: First... Second... Third..."</li>
    <li><strong class="hl">Valuation (15 seconds):</strong> Current multiple, why it's justified or not, target price/upside.</li>
    <li><strong class="hl">Risk + Mitigant (10 seconds):</strong> "The main risk is [X], but I'd mitigate this by noting [Y]."</li>
  </ol>
  <div class="funny">Think of it like an elevator pitch for a stock. You have 60 seconds, the elevator is moving, and your interviewer is the one deciding what floor you get off on -- the "hired" floor or the "thanks for coming in" floor.</div>
</div>
<div class="bx2 gr">
  <span class="tag tag-gr">Equity Research vs. Banking</span>
  <h4>Tips Specific to ER Interviews</h4>
  <p>Equity research interviews are different from investment banking interviews:</p>
  <ul>
    <li><strong>Show analytical depth:</strong> In banking, they want deal experience and technical skills. In ER, they want to see you THINK like an analyst. Your pitch should demonstrate sector knowledge and analytical rigor.</li>
    <li><strong>Know the metrics:</strong> For consumer staples, know SSS, volume vs. price, organic growth, gross margins. For healthcare, know pipeline catalysts, FDA timelines, patent cliffs.</li>
    <li><strong>Have an opinion and defend it:</strong> ER analysts get paid for their opinions. Don't be wishy-washy. Take a clear stance and be ready to defend it with data.</li>
    <li><strong>Match the firm's style:</strong> At BMO, Kelly Bania focuses on Food Retail & Distribution. At Leerink, they're healthcare specialists. Your pitch should show you understand what the team covers.</li>
  </ul>
</div>`,

${mkSc('c4s0','Lucas Cohen (BMO Senior Associate, CFA) says: "Walk me through your best stock idea."',[

()=>`<div class="bx in">

</div>
<div class="bx2 go">

${mkQ('c4q0','An interviewer asks "Who is on the other side of this trade?" What is the best way to respond?',

const FC=[
{f:"The 5-Part Pitch Framework",b:"(1) Company Overview -- what does it do? (2) Thesis / Why Now -- why is the market wrong? (3) Key Catalysts -- specific, time-bound events. (4) Valuation -- cheap or expensive? Target price. (5) Risks & Mitigants -- what could go wrong and why you still believe."},
{f:"Variant Perception",b:"An investment view that differs from the consensus. If every analyst agrees with your thesis, it's already priced in. A variant perception is WHERE you disagree with the market and WHY. Example: 'The market underestimates the impact of Costco's fee increase cycle.'"},
{f:"Catalyst",b:"A specific, time-bound event that will cause a stock to move in your predicted direction. Good catalysts: earnings report, product launch, regulatory decision, fee increase, M&A. Bad catalysts: 'growth' or 'good management' (too vague)."},
{f:"Margin of Safety",b:"The gap between a stock's intrinsic value and its market price. If you calculate intrinsic value at $100 and the stock trades at $70, you have a 30% margin of safety. The concept comes from Benjamin Graham. It protects you if your analysis is slightly wrong."},
{f:"Short Squeeze",b:"When heavily shorted stock rises, forcing short sellers to buy back shares (cover) to limit losses. This additional buying pressure pushes the price higher, causing more shorts to cover. Creates a feedback loop. GameStop (2021) was the most famous example."},
{f:"P/E Ratio (Price-to-Earnings)",b:"Stock price divided by earnings per share. Costco ~50x (premium, justified by growth), Walmart ~35x (moderate premium), Kroger ~15x (cheap, lower growth). Higher P/E = market expects higher growth or more durable earnings."},
{f:"Same-Store Sales (SSS / Comps)",b:"Revenue growth from stores open at least one year, excluding new store openings. THE key retail metric. Broken into traffic (more customers) and ticket (higher spend per visit). Healthy SSS for staples: 3-5%. Shows organic demand, not just store expansion."},
{f:"Borrow Cost (Shorting)",b:"The fee paid to borrow shares when shorting a stock. Ranges from <1% (easy to borrow) to 50%+ (hard to borrow). High borrow costs eat into short profits. Popular short targets often have high borrow costs because demand to borrow exceeds supply."},
{f:"Bull Case vs. Bear Case",b:"Bull case: reasons to be long (buy). Bear case: reasons to be short (sell). Great analysts can argue BOTH sides of any stock. In interviews, being asked to argue the other side is the ultimate test. It proves you've done thorough, unbiased analysis."},
{f:"DCF (Discounted Cash Flow)",b:"Valuation method that projects future free cash flows and discounts them back to present value using WACC. Shows what a company is worth based on its future cash generation. Common interview question: 'Walk me through a DCF.' Key inputs: revenue growth, margins, WACC, terminal value."},
{f:"Consumer Trade-Down",b:"When consumers switch from premium to cheaper alternatives. In a recession, shoppers move from Whole Foods to Costco/Walmart, from name brands to private label. Trade-down BENEFITS value retailers like Costco and Dollar General. It's a key theme in consumer staples."},
{f:"Equity Research vs. Investment Banking",b:"ER analysts publish stock recommendations, build financial models, write research notes, and advise institutional investors. Bankers execute deals (M&A, IPOs, debt offerings). ER interviews test INVESTMENT THINKING and analytical rigor. Banking interviews test technical skills and deal knowledge."},
];

function initCond(){
  COND.items=COND_ITEMS.map((item,i)=>({
    ...item,id:i,box:0,lastSeen:0,timesCorrect:0,timesWrong:0,nextDue:0
  }));
  COND.round=0;COND.idx=0;COND.correct=0;COND.wrong=0;COND.streak=0;COND.bestStreak=0;COND.history=[];COND.sessionXP=0;
  for(let i=COND.items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[COND.items[i],COND.items[j]]=[COND.items[j],COND.items[i]]}
}

function getDueItems(){
  return COND.items.filter(it=>{
    if(it.box===0) return true;
    const interval=[1,2,4,8][Math.min(it.box,3)];
    return (COND.round - it.lastSeen) >= interval;
  });
}

function startCond(mode){
  initCond();
  COND.mode=mode;
  COND.round=0;
  if(mode==='weak'){
    const hist=JSON.parse(localStorage.getItem('sp_cond_misses')||'{}');
    const hasWeaks=COND.items.some(it=>hist[it.q]);
    if(!hasWeaks){
      M().innerHTML=`<div class="bx in tc" style="padding:30px 22px">
        <div style="font-size:2em;margin-bottom:8px">🎯</div>
        <h2 style="font-size:1.2em">No Weak Spots Yet</h2>
        <p style="margin-top:8px">Run a Speed Round or Spaced Repetition session first -- then Weak Spots will target items you missed.</p>
        <div class="br" style="justify-content:center;margin-top:14px">
          <button class="btn btn-b" onclick="condMenu()">← Back</button>
        </div>
      </div>`;
      return;
    }
    COND.items.forEach(it=>{
      if(hist[it.q])it.box=0;
      else it.box=3;
    });
  }
  nextCondItem();
}

function nextCondItem(){
  COND.round++;
  if(COND.timer){clearInterval(COND.timer);COND.timer=null}

  let due=getDueItems();
  if(due.length===0) return condComplete();

  due.sort((a,b)=>a.box-b.box);
  const weights=due.map(it=>Math.max(4-it.box,1));
  const totalW=weights.reduce((s,w)=>s+w,0);
  let r=Math.random()*totalW,cum=0;
  let picked=due[0];
  for(let i=0;i<due.length;i++){cum+=weights[i];if(r<=cum){picked=due[i];break}}

  COND.current=picked;

  let presentMode=COND.mode;
  if(COND.mode==='marathon'){
    const modes=['speed','recall','reverse','interview'];
    presentMode=modes[Math.floor(Math.random()*modes.length)];
  }

  const done=COND.items.filter(it=>it.box>=2).length;
  const total=COND.items.length;
  const pct=Math.round(done/total*100);
  const catColors={framework:'var(--blue)',valuation:'var(--cyan)',costco:'var(--green)',shorting:'var(--red)',delivery:'var(--gold)',advanced:'var(--purple)'};
  const catNames={framework:'FRAMEWORK',valuation:'VALUATION',costco:'COSTCO',shorting:'SHORTING',delivery:'DELIVERY',advanced:'ADVANCED'};
  const catTag=`<span style="font-size:.6em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:${catColors[picked.cat]||'var(--dim)'}">${catNames[picked.cat]||picked.cat}</span>`;

  let topBar=`<div class="br" style="margin-bottom:10px">
    <button class="btn btn-g" onclick="if(COND.timer)clearInterval(COND.timer);condMenu()">← Back</button>
    <span style="flex:1"></span>
    <span style="color:var(--dim);font-size:.75em;align-self:center">${COND.correct+COND.wrong} answered · ${done}/${total} locked</span>
  </div>
  <div class="cm-bar"><div class="cm-fill" style="width:${pct}%"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0">
    ${catTag}
    <span style="font-size:.7em;color:var(--dim)">Box ${picked.box}/3 ${picked.box===0?'· New':picked.box===1?'· Learning':picked.box===2?'· Known':'· Mastered'}</span>
  </div>
  <div class="cm-streak-bar">${COND.history.slice(-20).map(h=>`<div class="cm-dot ${h?'hit':'miss'}"></div>`).join('')}</div>`;

  if(presentMode==='speed') renderSpeed(topBar,picked);
  else if(presentMode==='recall') renderRecall(topBar,picked);
  else if(presentMode==='reverse') renderReverse(topBar,picked);
  else if(presentMode==='interview') renderInterview(topBar,picked);
}

// ---- SPEED DRILL ----
function renderSpeed(topBar,item){
  const timeLimit=item.box>=2?4:6;
  COND.timeLeft=timeLimit;COND.totalTime=timeLimit;

  const wrongs=COND.items.filter(it=>it.id!==item.id).sort(()=>Math.random()-.5).slice(0,3).map(it=>it.a);
  const opts=[item.a,...wrongs].sort(()=>Math.random()-.5);

  M().innerHTML=`<div class="in">${topBar}
    <div class="cm-sci"><strong>Speed Round</strong> -- Automaticity training. React in under ${timeLimit}s. Speed builds reflexive knowledge that survives interview pressure (Bjork, 1994).</div>
    <div class="cm-timer" id="cm-time">${timeLimit}</div>
    <div class="cm-bar"><div class="cm-fill" id="cm-tbar" style="width:100%;background:linear-gradient(90deg,var(--green),var(--cyan))"></div></div>
    <div class="cm-prompt">${item.q.replace('___','______')}</div>
    <div class="cm-box">${opts.map((o,i)=>`<button class="cm-opt" id="cmO${i}" onclick="condSpeedPick(${i},'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
    <div id="cm-fb"></div>
  </div>`;

  COND.timer=setInterval(()=>{
    COND.timeLeft-=0.1;
    const el=$('cm-time');const bar=$('cm-tbar');
    if(!el){clearInterval(COND.timer);return}
    const t=Math.max(0,COND.timeLeft);
    el.textContent=t.toFixed(1);
    bar.style.width=(t/COND.totalTime*100)+'%';
    if(t<=3&&t>1.5)el.className='cm-timer warn';
    else if(t<=1.5)el.className='cm-timer crit';
    if(COND.timeLeft<=0){
      clearInterval(COND.timer);
      condAnswer(false);
      document.querySelectorAll('.cm-opt').forEach(b=>{b.classList.add('lk');b.onclick=null});
      $('cm-fb').innerHTML=`<div class="qz-e"><strong style="color:var(--red)">Time's up!</strong> The answer is: <strong style="color:var(--cyan)">${item.a}</strong></div>`;
      setTimeout(nextCondItem,2000);
    }
  },100);
  window.scrollTo({top:0,behavior:'smooth'});
}

window.condSpeedPick=function(idx,picked){
  if(COND.timer)clearInterval(COND.timer);
  const item=COND.current;
  const ok=picked===item.a;
  condAnswer(ok);
  document.querySelectorAll('.cm-opt').forEach((b,i)=>{
    b.classList.add('lk');b.onclick=null;
    if(b.textContent===item.a)b.classList.add('ok');
    else if(i===idx&&!ok)b.classList.add('no');
  });
  const speed=(COND.totalTime-COND.timeLeft).toFixed(1);
  $('cm-fb').innerHTML=`<div class="qz-e">${ok?`<strong style="color:var(--green)">Correct!</strong> ${speed}s reaction time.`:`<strong style="color:var(--red)">Wrong.</strong> The answer is: <strong style="color:var(--cyan)">${item.a}</strong>`}</div>`;
  setTimeout(nextCondItem,ok?1200:2500);
};

window.condRecallHint=function(){
  const item=COND.current;
  const hint=item.hints[Math.floor(Math.random()*item.hints.length)];
  COND.sessionXP=Math.max(0,COND.sessionXP-5);
  $('cm-hint').disabled=true;$('cm-hint').textContent='Hint: '+hint;
};

window.condRecallSubmit=function(){
  if(COND.timer)clearInterval(COND.timer);
  const item=COND.current;
  const inp=$('cm-inp');if(!inp||inp.disabled)return;
  const val=inp.value.trim().toLowerCase();
  inp.disabled=true;

  const answer=item.a.toLowerCase();
  const ok=val===answer || val.includes(answer) || (answer.includes(val) && val.length>=Math.min(3,answer.length)) || (val.replace(/[^a-z0-9]/g,'')===answer.replace(/[^a-z0-9]/g,''));

  condAnswer(ok);
  inp.classList.add(ok?'ok':'no');
  $('cm-fb').innerHTML=`<div class="qz-e">${ok?`<strong style="color:var(--green)">Correct!</strong>`:`<strong style="color:var(--red)">Not quite.</strong> The answer is: <strong style="color:var(--cyan)">${item.a}</strong>`}</div>`;
  setTimeout(nextCondItem,ok?1200:2500);
};

// ---- REVERSE CARDS (Interleaving) ----
function renderReverse(topBar,item){
  const timeLimit=10;
  COND.timeLeft=timeLimit;COND.totalTime=timeLimit;

  const qShort=item.q.replace(/___/g,'').replace(/\s+/g,' ').trim();
  const wrongQs=COND.items.filter(it=>it.id!==item.id&&it.cat!==item.cat).sort(()=>Math.random()-.5).slice(0,3).map(it=>it.q.replace(/___/g,'').replace(/\s+/g,' ').trim());
  const opts=[qShort,...wrongQs].sort(()=>Math.random()-.5);

  M().innerHTML=`<div class="in">${topBar}
    <div class="cm-sci"><strong>Interleaving</strong> -- Bidirectional recall builds stronger neural pathways. Answer to question forces deeper encoding (Bjork & Bjork, 1992).</div>
    <div class="cm-timer" id="cm-time">${timeLimit}</div>
    <div class="cm-bar"><div class="cm-fill" id="cm-tbar" style="width:100%;background:linear-gradient(90deg,var(--purple),var(--blue))"></div></div>
    <div class="cm-prompt">The answer is: <span style="color:var(--cyan);font-size:1.2em">${item.a}</span><br><span style="font-size:.8em;color:var(--dim)">What was the question?</span></div>
    <div style="display:flex;flex-direction:column;gap:7px">${opts.map((o,i)=>`<button class="cm-opt" style="text-align:left;padding:12px 14px;font-size:.84em;font-weight:400" id="cmR${i}" onclick="condReversePick(${i})">${o}</button>`).join('')}</div>
    <div id="cm-fb"></div>
  </div>`;

  COND._revOpts=opts;COND._revCorrect=qShort;
  COND.timer=setInterval(()=>{
    COND.timeLeft-=0.1;
    const el=$('cm-time');const bar=$('cm-tbar');
    if(!el){clearInterval(COND.timer);return}
    const t=Math.max(0,COND.timeLeft);
    el.textContent=t.toFixed(1);
    bar.style.width=(t/COND.totalTime*100)+'%';
    if(t<=3.5&&t>1.5)el.className='cm-timer warn';
    else if(t<=1.5)el.className='cm-timer crit';
    if(COND.timeLeft<=0){
      clearInterval(COND.timer);
      condAnswer(false);
      document.querySelectorAll('.cm-opt').forEach(b=>{b.classList.add('lk');b.onclick=null});
      $('cm-fb').innerHTML=`<div class="qz-e"><strong style="color:var(--red)">Time's up!</strong> It was: <strong style="color:var(--cyan)">${qShort}</strong></div>`;
      setTimeout(nextCondItem,2500);
    }
  },100);
  window.scrollTo({top:0,behavior:'smooth'});
}

window.condReversePick=function(idx){
  if(COND.timer)clearInterval(COND.timer);
  const picked=COND._revOpts[idx];
  const ok=picked===COND._revCorrect;
  condAnswer(ok);
  document.querySelectorAll('.cm-opt').forEach((b,i)=>{
    b.classList.add('lk');b.onclick=null;
    if(b.textContent===COND._revCorrect)b.classList.add('ok');
    else if(i===idx&&!ok)b.classList.add('no');
  });
  $('cm-fb').innerHTML=`<div class="qz-e">${ok?`<strong style="color:var(--green)">Correct!</strong>`:`<strong style="color:var(--red)">Wrong.</strong> It was: <strong style="color:var(--cyan)">${COND._revCorrect}</strong>`}</div>`;
  setTimeout(nextCondItem,ok?1200:2500);
};

// ---- INTERVIEW PRESSURE ----
const INTERVIEW_FRAMES=[
  q=>`Ben Wood leans forward: "${q.replace('___','what?')}"`,
  q=>`Lucas Cohen, CFA, tests your recall: "${q.replace('___','fill in the blank?')}"`,
  q=>`Ben, ex-Point72, wants speed: "${q.replace('___','...')}"`,
  q=>`Lucas probes your pitch knowledge: "${q.replace('___','what exactly?')}"`,
  q=>`Ben raises an eyebrow: "Every good candidate knows this. ${q.replace('___','what?')}"`,
  q=>`Lucas checks your homework: "${q.replace('___','...')}?"`,
  q=>`Ben tests your conviction: "You tell me -- ${q.replace('___','what?')}"`,
  q=>`Lucas pauses mid-note: "${q.replace('___','go ahead')}"`,
  q=>`Ben, channeling his hedge fund days: "Walk me through it. ${q.replace('___','...')}"`,
  q=>`A Leerink interviewer asks: "For your pitch -- ${q.replace('___','what?')}"`,
  q=>`Kelly Bania herself jumps in: "${q.replace('___','tell me')}"`,
  q=>`The managing director looks up from your resume: "${q.replace('___','...')}"`,
];

function renderInterview(topBar,item){
  const timeLimit=8;
  COND.timeLeft=timeLimit;COND.totalTime=timeLimit;
  const frame=INTERVIEW_FRAMES[Math.floor(Math.random()*INTERVIEW_FRAMES.length)](item.q);

  M().innerHTML=`<div class="in">${topBar}
    <div class="cm-sci"><strong>Interview Pressure</strong> -- Practicing under social pressure conditions your stress response. The testing effect under arousal creates the strongest memories (Cahill & McGaugh, 1998).</div>
    <div class="cm-timer" id="cm-time">${timeLimit}</div>
    <div class="cm-bar"><div class="cm-fill" id="cm-tbar" style="width:100%;background:linear-gradient(90deg,var(--orange),var(--gold))"></div></div>
    <div class="dl"><div class="dl-av int">INT</div><div class="dl-bb"><div class="dl-n int">Interviewer</div><div class="dl-t">${frame}</div></div></div>
    <input class="cm-input" id="cm-inp" placeholder="Your answer..." autocomplete="off" onkeydown="if(event.key==='Enter')condInterviewSubmit()">
    <div class="br" style="justify-content:center;margin-top:8px">
      <button class="btn btn-b" onclick="condInterviewSubmit()">Answer</button>
    </div>
    <div id="cm-fb"></div>
  </div>`;
  $('cm-inp').focus();

  COND.timer=setInterval(()=>{
    COND.timeLeft-=0.1;
    const el=$('cm-time');const bar=$('cm-tbar');
    if(!el){clearInterval(COND.timer);return}
    const t=Math.max(0,COND.timeLeft);
    el.textContent=t.toFixed(1);
    bar.style.width=(t/COND.totalTime*100)+'%';
    if(t<=4&&t>2)el.className='cm-timer warn';
    else if(t<=2)el.className='cm-timer crit';
    if(COND.timeLeft<=0){
      clearInterval(COND.timer);
      condAnswer(false);
      $('cm-inp').classList.add('no');$('cm-inp').disabled=true;
      $('cm-fb').innerHTML=`<div class="dl" style="margin-top:10px"><div class="dl-av int">INT</div><div class="dl-bb"><div class="dl-n int" style="color:var(--red)">Interviewer</div><div class="dl-t">The answer was <strong>${COND.current.a}</strong>. Let's move on...</div></div></div>`;
      setTimeout(nextCondItem,2500);
    }
  },100);
  window.scrollTo({top:0,behavior:'smooth'});
}

window.condInterviewSubmit=function(){
  if(COND.timer)clearInterval(COND.timer);
  const item=COND.current;
  const inp=$('cm-inp');if(!inp||inp.disabled)return;
  const val=inp.value.trim().toLowerCase();
  inp.disabled=true;
  const answer=item.a.toLowerCase();
  const ok=val===answer||val.includes(answer)||(answer.includes(val)&&val.length>=Math.min(3,answer.length));
  condAnswer(ok);
  inp.classList.add(ok?'ok':'no');
  $('cm-fb').innerHTML=`<div class="dl" style="margin-top:10px"><div class="dl-av int">INT</div><div class="dl-bb"><div class="dl-n int" style="color:var(${ok?'--green':'--red'})">${ok?'Interviewer (impressed)':'Interviewer'}</div><div class="dl-t">${ok?`"That's right -- <strong>${item.a}</strong>. Good." `:`"Actually, it's <strong>${item.a}</strong>. Let's keep going."`}</div></div></div>`;
  setTimeout(nextCondItem,ok?1200:2500);
};

// ---- CORE CONDITIONING LOGIC ----
function condAnswer(ok){
  const item=COND.current;
  item.lastSeen=COND.round;
  if(ok){
    item.box=Math.min(item.box+1,3);
    item.timesCorrect++;
    COND.correct++;
    COND.streak++;
    if(COND.streak>COND.bestStreak)COND.bestStreak=COND.streak;
    COND.sessionXP+=10+(item.box*5);
    S.xp+=10;
    if(COND.streak===5)toast('5x Conditioning Streak!','b');
    if(COND.streak===10)toast('10x STREAK! Your synapses are FIRING!','b');
    if(COND.streak===15)toast('15x!! UNSTOPPABLE NEURAL PATHWAYS!','b');
    if(item.box===3)toast('Item MASTERED! Locked in long-term memory.','g');
  }else{
    item.box=Math.max(item.box-1,0);
    item.timesWrong++;
    COND.wrong++;
    COND.streak=0;
    const hist=JSON.parse(localStorage.getItem('sp_cond_misses')||'{}');
    hist[item.q]=(hist[item.q]||0)+1;
    localStorage.setItem('sp_cond_misses',JSON.stringify(hist));
  }
  COND.history.push(ok);
  upd();
}

function condComplete(){
  if(COND.timer)clearInterval(COND.timer);
  const mastered=COND.items.filter(it=>it.box>=3).length;
  const conditioned=COND.items.filter(it=>it.box>=2).length;
  const pct=Math.round(COND.correct/(COND.correct+COND.wrong)*100)||0;

  M().innerHTML=`<div class="bx in tc" style="padding:34px 22px">
    <div style="font-size:2.5em;margin-bottom:6px">🧠</div>
    <h2 style="font-size:1.3em">Session Complete</h2>
    <p style="margin-top:6px;color:var(--dim)">Your pitch knowledge just got a serious upgrade.</p>
    <div class="rs" style="margin-top:14px">
      <div class="rs-i"><div class="rs-v" style="color:var(--green)">${pct}%</div><div class="rs-l">Accuracy</div></div>
      <div class="rs-i"><div class="rs-v" style="color:var(--cyan)">${COND.bestStreak}</div><div class="rs-l">Best Streak</div></div>
      <div class="rs-i"><div class="rs-v" style="color:var(--gold)">${COND.sessionXP}</div><div class="rs-l">Session XP</div></div>
    </div>
    <div class="rs" style="margin-top:8px">
      <div class="rs-i"><div class="rs-v" style="color:var(--purple)">${mastered}</div><div class="rs-l">Mastered</div></div>
      <div class="rs-i"><div class="rs-v" style="color:var(--blue)">${conditioned}</div><div class="rs-l">Conditioned</div></div>
      <div class="rs-i"><div class="rs-v" style="color:var(--dim)">${COND.items.length-conditioned}</div><div class="rs-l">Need Work</div></div>
    </div>
    <div class="cm-sci" style="margin-top:14px;text-align:left">
      <strong>What just happened in your brain:</strong><br>
      Every correct retrieval strengthened the neural pathway to that memory. Items you got wrong were re-queued at shorter intervals. Run this again in 30-60 minutes for maximum long-term encoding (spacing effect).
    </div>
    ${(()=>{
      const weak=COND.items.filter(it=>it.timesWrong>0).sort((a,b)=>b.timesWrong-a.timesWrong).slice(0,5);
      if(weak.length===0)return '<div class="bx2 gr" style="margin-top:12px"><span class="tag tag-gr">PERFECT SESSION</span><p>Zero misses. Your neural pathways are locked in. You\\'re ready to pitch.</p></div>';
      return '<div class="bx2 re" style="margin-top:12px"><span class="tag tag-re">YOUR WEAK SPOTS</span><p style="margin-bottom:8px">These came back to haunt you -- hit "Weak Spots" mode to drill them:</p><ul>'+weak.map(w=>`<li style="font-size:.84em"><strong>${w.q.replace(/___/g,'___')}</strong> → <span style="color:var(--cyan)">${w.a}</span> <span style="color:var(--red);font-size:.8em">(missed ${w.timesWrong}x)</span></li>`).join('')+'</ul></div>';
    })()}
    <div class="br" style="justify-content:center;margin-top:14px">
      <button class="btn btn-b" onclick="startCond(COND.mode)">Run Again</button>
      <button class="btn btn-g" onclick="startCond('weak')">Weak Spots</button>
      <button class="btn btn-g" onclick="condMenu()">Change Mode</button>
      <button class="btn btn-g" onclick="goMenu()">Main Menu</button>
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

upd();goMenu();
</script>
